# Feed row: written by pipeline/ingest/wv_echo_cso_monthly.py (data/build/events/wv-echo-dmr-cso.json).
# Built 2026-11-14: every one of the 61 permits with an open combined sewer outlet in DEP's layer was asked once for all
#   parameters, January 2025 to date. 59 file no line at any combined sewer outlet (their reports cover the plant's own
#   outfalls). Two file a monthly line at outlet C002 ('Effluent Gross'): Princeton Sanitary Board (WV0023094) and the
#   City of Beckley (WV0023183), each 50050 flow (MGD), total residual chlorine and fecal coliform. None of the 61
#   reported a number of overflows, hours or a volume at a combined sewer outlet in that period (read 2026-11-14).
# Real read: Beckley's C002 16 months with flow reported (January 2025 to September 2026; daily maximum up to 5.8 MGD),
#   5 months filed no discharge; Princeton's C002 21 months filed NODI C (no discharge). Median 24 days from the month's
#   end to EPA's receipt.
# Records: month precision (the monthly mark, never red or yellow; build/status.py EPA_MONTHLY_SOURCES); placed at the
#   registry outlet (DEP's point; Beckley's C002 has no receiving stream in DEP's layer, so no water until the batch).
# Cannot fill: the day or hour of a discharge; an end; a volume (the figure is a rate); the number of overflows.
