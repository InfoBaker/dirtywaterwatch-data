# Feed row: written by pipeline/ingest/ma_springfield_aquasight.py (data/build/events/ma-springfield-aquasight.json).
# Built 2026-11-28: hourly. The commission's map is an Aquasight (ADS Environmental Services) app over a DreamFactory
#   API at api2.aquasight.io; the app's own script carries the key it sends, read at each run and never stored. Three
#   tables: the outfall list (24 outfalls), the current status per outfall (to meta) and the overflow log, one row per
#   overflow with start and end (2,134 rows, 2022-03-19 to 2026-11-26, on 2026-11-28). One cso record per log row, to
#   the minute in Eastern time (the map states no zone).
# Volume: the map prints each outfall's three-year average discharge per event, the commission's estimate for its
#   notice; carried as an estimate only on events since that average was set (2026-01-12).
# One event, not two: a row and MassDEP's portal record of the same overflow (permit MA0101613, same outfall, starts
#   within 10 minutes) are linked with duplicate_of to the portal's shown record. Against the portal file of
#   2026-11-14: 1,286 rows linked, the rest before the portal's first day (2022-07-06), after the file or not filed.
