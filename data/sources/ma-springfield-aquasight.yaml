access_detail: "Aquasight app at external.aquasight.io, embedded on the commission's CSO map page. DreamFactory tables ads_us_config, cso_status and cso_status_log on api2.aquasight.io, GET with a filter on community springfield_ma_ads_us and the X-Dreamfactory-API-Key header the app sends. Times are local clock with no zone."
