# Feed row: written by pipeline/ingest/tx_utility_spill_news.py --site elpaso (data/build/events/tx-el-paso-water-spill-news.json).
# Built 2026-11-17: hourly; the newsroom's first 25 releases (--backfill reads ?show=all, every release since 2019). Read
#   by the same rules as Austin Water's; Mountain time (America/Denver). A release saying the spill stayed on the
#   plant's property or reached no waterway has raw.reached_water false. A title with "update" is a follow-up, not a
#   new spill. Placed only on a named water (the Rio Grande); else listed with El Paso County. Quoted officials and the
#   named division contact are never read into a record.
#   Read 2026-11-17: 189 releases, eight spill releases and one update (March 2020 to May 2026); two met a TCEQ
#   open-data row by day and plant (one with no volume in TCEQ's table). The newsroom answers GitHub's runner (probe
#   43886270609).
