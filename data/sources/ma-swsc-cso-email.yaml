# Feed row: written by pipeline/ingest/operator_mail.py (parser ingest/mail/springfield.py), one events file per list
#   (data/mail-lists.json "springfield"), read from the project's mail intake (address springfield@dirtywaterwatch.org).
# Built 2026-11-17. The advisory 314 CMR 16.04 requires within two hours of discovery: outfall, start, estimated volume,
#   waters, towns, cessation. Signed up 2026-11-02 and again 2026-11-17; no message had arrived by 2026-11-17 although the
#   portal shows Springfield notices from 2026-11-06, so the list is checked against ma-massdep (meta.quiet). The parser
#   is written from the rule and the portal's records and fails loudly until checked against a real notice.
