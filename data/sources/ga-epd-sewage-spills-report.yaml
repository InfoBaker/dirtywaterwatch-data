# Notes (research/ga, status used, verified fetched, checked 2026-11-04): Statewide rolling 30-day
#   list of municipal sewage spills, updated each business day, as an Excel file whose URL carries
#   the date. Day precision, permit number, location address, gallons, river basin, waterway
#   impacted. First feed (with daily snapshots to build history; history backfill from EPD's dated
#   postings since 2025-10-09). Built: pipeline/ingest/ga_epd_spills.py (feed ga-epd-spills;
#   --backfill reads the dated postings).
# Access detail (research, quoted): Page https://epd.georgia.gov/sewage-spills-report links a dated
#   file: https://epd.georgia.gov/document/document/sewagespillsreport20261103/download (labelled
#   XLS, actually an .xlsx workbook, 24.5 KB). Row 1 "Posting Date"; row 2 headers; 60 rows on
#   2026-11-03 (57 Oct, 3 Nov). Saved as raw/sewagespillsreport20261103.xlsx.
# Can fill: event_type (OVERFLOW_DESTINATION incl. "CSO Dry-weather"), started_at (date only),
#   location_text, volume, waterbody, authority, published_at (Posting Date)
# Cannot fill: ended_at; start time; coordinates (address only; the map layer has points); stable
#   id; advice_text
# Waters: statewide; WATERWAY_IMPACTED free text, RIVER_BASIN
# History: Rolling 30 days on each posting. Older dated postings stay at the same URL pattern: on
#   2026-11-04 EPD served every business day's file from 2025-10-09 (earlier days answer 404; probed
#   monthly back to 2018-01), all with the same 13 columns (BEGIN_DATE before mid October 2026; ten
#   files add EPD's LATITUDE / LONGITUDE, used as the row's point; the 2026-10-13 file adds
#   SPILL_END_DATE, kept as given but not used as the end). Backfill (python -m ingest.ga_epd_spills
#   --backfill, once, by hand, never hourly): every posting from 2025-10-09, so spills that began
#   from 2025-09-09, with the fields and day precision the files give and no end; one record per
#   spill with the daily feed (same key), paired with EPA's reports by the feed's rules; the
#   postings are kept with the pipeline state. WWALS has archived daily copies as HTML since Dec
#   2018 (a cross-check only, not a record source).
# Research notes: "A zero in the quantity field indicates the amount of the spill has not been
#   determined." Quantity blank at first for many rows. No row id: key on permit + begin date +
#   location.
cadence: "Each business day; spills appear within about one day of start (three rows dated 2026-11-02 on the 2026-11-03 file). Law: immediate notice to EPD."
