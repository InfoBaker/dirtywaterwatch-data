# Notes (research/ct, status candidate, verified fetched, checked 2026-11-01): Independent second
#   channel: dispatch-call log including 'Sewage Incident' type (1,866 sewage rows since 2022-07);
#   public domain; monthly refresh; no volumes in most rows.
# Access detail (research, quoted): Socrata SODA, no auth: ?$where=upper(chemicals) like
#   '%SEWAGE%'&$order=reported_date DESC. 16,925 rows total. Older set wr2a-rnsg (1996-2022-06).
