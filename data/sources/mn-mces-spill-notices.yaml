# Read by pipeline/ingest/mn_mces_spill_notices.py: the index's "Spill information" list and each linked page, one sso
#   record per spill, the day the Council responded as reported_at (the spill's start is not given and stays null);
#   the Council's "Do Not Enter/ Sewage Spill" signs are its own window (advisory_active; "will be removed" is no lift:
#   standing to the end of that update's day, then the end not confirmed; "have been removed" ends the window with
#   that day); the water a notice says was reached is placed (by name, county-aware), a notice saying no water was
#   reached is kept and placed nowhere.
# Real read 2026-11-14: three spills listed. Excelsior (responded 2026-05-29, stopped that day; reached Mud Pond; signs
#   posted, their removal announced 2026-06-01, not confirmed), Minneapolis and Golden Valley (responded and stopped
#   2026-07-09; a low-lying area connected to Bassett Creek, which sampling found unaffected; signs, removal announced
#   2026-07-16, not confirmed), Eagan (2026-11-03; contained in under an hour; no waterbody impacted). The index says
#   notices stay posted for one year.
cadence: "event-driven; the index and each page read every run (four requests, two seconds apart)"
