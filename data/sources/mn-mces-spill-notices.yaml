# Read by pipeline/ingest/mn_mces_spill_notices.py: the index's "Spill information" list and each linked page, one sso
#   record per spill, dated to the day the Council responded; the Council's "Do Not Enter/ Sewage Spill" signs are its
#   own window (advisory_active until a dated update says they will be removed, then a window from the stop to the end
#   of that update's day); the water a notice says was reached
#   is placed (by name, county-aware), a notice saying no water was reached is kept and placed nowhere.
# Real read 2026-11-14: three spills listed. Excelsior (responded 2026-05-29; reached Mud Pond; signs posted, their
#   removal announced 2026-06-01: a 72-hour window after the stop day), Minneapolis and Golden Valley (2026-07-09; a low-lying area connected to Bassett
#   Creek, which sampling found unaffected; signs, removal announced 2026-07-16), Eagan (2026-11-03; contained in under
#   an hour; no waterbody impacted). The index says notices stay posted for one year.
