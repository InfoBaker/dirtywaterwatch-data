# Read by ingest/mo_msd_alerts.py (source id mo-msd-stl-project-clear). The Metropolitan St. Louis Sewer District posts
#   some overflows, force main breaks and discharges as alerts and news releases; the REST API returns every post
#   with its publication time (date_gmt) and text. Only the District's own paths are read (alerts, press-releases,
#   post-types), never "in-the-news" (press coverage, 425 posts) or the blog.
# Real fetch 2026-11-14: 845 posts, 275 on the District's own paths, 89 overflow notices from 2013-06-19 to 2026-01-01
#   (79 overflows; 10 follow-ups such as "Repairs ... Completed" linked to their first notice): 2013 6, 2014 8, 2015 7,
#   2016 12, 2017 4, 2018 8, 2019 11, 2020 6, 2021 5, 2022 5, 2023 2, 2024 4, 2025 1 (the post of 2026-01-01). 47 of the
#   79 name a receiving water (Coldwater Creek, River des Peres, the Mississippi, Missouri and Meramec rivers, Fee Fee,
#   Fern Ridge, Maline, Kiefer and Sugar creeks among them). Days come from the text ("discovered Tuesday morning" is
#   the latest Tuesday on or before the post): 32 the day found, 14 reported, 12 occurred, 3 started, 8 unlabelled, and
#   10 give no day and are dated to the post's day; 8 give a clock time; 17 a volume.
#   MSD never gives an end time; an avoid-contact sentence is kept as advice, its condition never turned into a date.
# The "Sewer Discharge" category holds only 9 of these posts and is not the filter.
cadence: "irregular; MSD posts some overflows the day they are found"
