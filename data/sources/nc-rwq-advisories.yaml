# Feed row: the source id written by pipeline/ingest/nc_rwq_advisories.py (data/build/events/nc-rwq-advisories.json).
# Since 2026-11-21 (own-fixes, after the Swim Guide review) it reads the PUBLICVIEW service DMF's dashboard uses:
#   layer 0 (229 stations) and table 2 Beach_Activity (605 advisories and pending resamples since 2005, with DMF's
#   START_DATE and END_DATE; 93 begun in 2026). Each activity is a record with DMF's dates; Precautionary stays a
#   snapshot spell of the station status. Compared on 2026-11-21 with the 2022 layer it read before
#   (RWQ_Advisory_EXTERNAL/FeatureServer/1): the 2022 layer still showed N88 as an Advisory that DMF ended on
#   2026-10-31 and lacked N14A's and N17A's Precautionary status; 5 stations were only in PUBLICVIEW and 1 (C56B)
#   only in the 2022 layer. The 2022 layer's N88 record points to DMF's (duplicate_of); its precautionary spells
#   continue under their own ids.
# Notes (research/nc, status used, verified fetched, checked 2026-11-04): Coastal (ocean and sound)
#   monitoring stations with current Status (No Alert / Pending Swimming Advisory / Advisory /
#   Precautionary). Built: pipeline/ingest/nc_rwq_advisories.py (snapshot spells; 225 stations on
#   2026-11-04).
# Research notes: 225 stations on 2026-11-03: 216 No Alert, 8 Precautionary, 1 Advisory. The program
#   also issues sewage-spill swimming advisories by press release (search only). Related layer
#   PUBLICVIEWRecreationWaterQualityDatabase (229 stations). Checked 2026-11-04: the station Data
#   links (xapps.ncdenr.org/mf/beaches/smplData.do) answer 404; the layer's last data edit was
#   2026-09-03, so the 1 Advisory and 8 Precautionary stations had not been re-confirmed since then.
#   Precautionary is the storm-water discharge area advisory of .3404(c).
