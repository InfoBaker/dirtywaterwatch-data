# Ingester: pipeline/ingest/or_oha_beaches.py (source id or-oha-beach-monitoring), a snapshot of the status table read
#   every refresh. One table per coast, each row County | Beach | Status, the status one of OPEN, ADVISORY, SEWAGE
#   ("Sewage spills or major pollution events occurred. Avoid swimming or water contact.") and NO MONITORING.
#   ADVISORY opens a beach advisory; SEWAGE opens OHA's sewage advisory (sewage category); OPEN and NO MONITORING are
#   no record. The page gives no dates: an advisory runs from the first read that shows it to the first that does not.
# Read 2026-11-07: "The 2026 monitoring season has ended"; 33 beaches, all NO MONITORING, so no record. The reader was
#   written from the page's markup for the 2027 season (mid-May to mid-September) and is tested on a fixture in that
#   markup; check its first in-season reads. Advisory notices also by e-mail (GovDelivery ORHA_190).
