# Ingester: pipeline/ingest/mt_deq_hab_map.py (source id mt-deq-hab-map): one query of the safe fields every run.
# Read 2026-11-14: 445 rows (2019 to 2026; 77 in 2026), none at Caution or Closure at the read. 278 advisories: 255 with
#   DEQ's lift date, 23 with no lift date (aged by the site's 14-day rule), none current; 2020: 32, 2021: 29, 2022: 41,
#   2023: 19, 2024: 41, 2025: 58, 2026: 58
#   (two rows hold a reissue after a lift: a second record each). Not records: 126 rows with no issued date (public reports DEQ did not turn
#   into an advisory), 5 whose note says no advisory was issued, 38 DEQ marked Green Algae/Other. 6 rows at waters the
#   report calls not publicly accessible keep their county only.
# Times: DEQ's advisory_issued and advisory_lifted fields are free text holding dates ("7/21: based on photos", "8/3/2026
#   no new info"); the earliest date of the issue note is the issue date, and the lift date is the date the lift note
#   gives for the lift itself (a sampling or test date is not the lift; a pending, planned or conditional lift is none),
#   day precision, Mountain time; a date with no year takes the year of the observation. Most lifts come 14 days after
#   the issue with "no new info". With no lift date: confirmed at each read while the map shows Caution or Closure, then
#   aged by the 14-day rule from the last read that showed it (from the issue date if none did).
# Privacy: the reporter's description, photo link and illness answers are never requested; the advisory notes can name
#   people, so only their dates and the words caution, closure and toxin are kept, in records and in the raw save.
# Terms (the item's licence): "Data intended for reference and planning purposes only ... DEQ cannot verify accuracy or
#   contents of publicly editable data."
cadence: "edited by DEQ through the season; read every run"
