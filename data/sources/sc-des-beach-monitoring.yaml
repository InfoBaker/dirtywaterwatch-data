access_detail: "MapServer layer 0 query (where 1=1, outFields OBJECTID, STAT, HUC_12, COUNTY, ADVISORY, outSR 4326), no token."
machine_readable: true
legal_basis: "Voluntary: DES's Beach Monitoring program (EPA BEACH Act grant program); no South Carolina statute requires the advisories"
