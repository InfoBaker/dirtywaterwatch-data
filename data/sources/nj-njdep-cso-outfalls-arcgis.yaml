# Notes (research/nj, status used, verified fetched, checked 2026-11-02): Authoritative outfall list
#   with coordinates, DSNs and receiving waters; joins to ECHO DMRs by permit+DSN.
# Access detail (research, quoted): GET
#   .../MapServer/0/query?where=1%3D1&outFields=*&returnGeometry=false&f=json (no auth;
#   maxRecordCount 2000). All 211 fetched (raw/cso-outfalls-all.json). Metadata page
#   https://www.nj.gov/dep/gis/digidownload/metadata/html/Util_NJPDES_CSO.html returned 403 to curl.
# Can fill: coordinates (outfall point, source NJDEP, precision: surveyed point), geometry (outfall
#   point), waterbody, location_text, authority, source_record_id (CSO_ID)
# Cannot fill: any event times or volumes
# Waters: 211 points, 21 permittees statewide (openboatlaunch slugs: passaic-river-nj,
#   hackensack-river-nj, hudson-river-nj, newark-bay-nj, delaware-river-nj, cooper-river-nj,
#   raritan-river-nj, overpeck-creek-nj)
# Research notes: CSO_STAT: Active 207, Sealed 4 (Bayonne 2, Harrison 1, NHSA River Road 1). EPA
#   ECHO CSO inventory lists 225 NJ CSO permit features (difference to reconcile). Per-permit
#   summary in raw/cso-outfalls-by-permit.json.
