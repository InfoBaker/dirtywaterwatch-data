# Read by the national eRule module (echo-sewer-overflow) with Indiana in its states since 2026-11-14.
# 2026-11-12 extract (current and all-versions): one Indiana report, Shelbyville's plant bypass (IN0032867,
#   2026-08-12 21:30 to 2026-08-13 14:55, 5,055,000 gallons by automated monitoring, Big Blue River), filed through
#   EPA's own system (ES1) and received the next day. IDEM takes overflow and bypass reports on State Form 48373 and
#   says it will move them to EPA's NeT-SewerOverflow system; until then almost nothing reaches these tables. The
#   collection-system table lists Indiana systems with their combined share (Portland 100 per cent, Madison 100,
#   Elkhart 100, Speedway 100, Crawfordsville 92 ...).
# Indiana's rules in the module: the zone by the event's point (Eastern, or Central in the twelve counties of 49 CFR
#   71.5(b)); raw.time_zone on every record; the free-text scrub.
