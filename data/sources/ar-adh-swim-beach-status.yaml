# Read by ingest/ar_adh_swim_beaches.py: the beaches listed under "Closed Swim Beaches" as standing closures in the
#   Department's words, one record per beach (ADH's SB number), from the first read that lists it (the page gives no
#   date) until a read no longer does. On 2026-11-14 the list held one beach, "SB112 - Jefferson Ridge West". The page
#   gives no date, reason, water or point, and USGS GNIS has no feature of that name: the record is listed and placed on
#   no water until a cited point is added. The page answered this site's identified client (200) on 2026-11-14; the
#   2026-11-09 research had a 403.
# The program (the page, quoted): it "monitors all sample results submitted to the Public Health Lab and advises the
#   State Parks Commission, Environmental Health specialists, U.S. Forest Service, both the Little Rock and Vicksburg
#   Corps of Engineer Districts, and all private swim beaches with the status of opening or closing beaches to
#   swimmers"; a sample above 126 E. coli per 100 ml triggers daily resampling. The "140 swim beach sites" the page
#   gives is a 2007 figure.
