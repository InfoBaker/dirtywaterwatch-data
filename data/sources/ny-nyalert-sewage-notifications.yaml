# Notes (research/ny, status candidate, verified fetched, checked 2026-11-01): Authoritative push
#   channel; can be machine-ingested by parsing subscribed emails (template is fixed). Requires
#   owner sign-up per county (62 counties).
# Access detail (research, quoted): Requires a NY.gov ID account, then NY-Alert (Everbridge member
#   portal https://member.everbridge.net/saml/login/NYAlert/...) subscription: My Subscriptions >
#   Edit > county > check 'Sewage Discharge Notifications'. Channels per alert.ny.gov/about: 'email,
#   text messaging, phone, and fax'. No public RSS (alert.ny.gov/rss.xml is an empty Drupal
#   channel), no public API, no public archive page. The legacy nyalert.gov host no longer resolves.
#   Owner must subscribe (account creation not done by agent).
# Can fill: as ny-dec-sprtk-page-recent-alerts
# Cannot fill: as ny-dec-sprtk-page-recent-alerts
# Waters: statewide by county subscription
# History: none public
# Research notes: alert.ny.gov/about lists 'Sewage Discharge Notifications - Be informed when public
#   waterways near you are impacted by untreated and partially treated sewage discharges'.
cadence: "push, as filed; law: 'as soon as possible but no later than four hours' after discovery to the public"
