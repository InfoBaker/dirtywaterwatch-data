# Feed row: the source id written by the ingester pipeline/ingest/ny_sprtk.py
#   (data/build/events/ny-dec-sprtk.json). It describes the same source as the research row(s) in
#   registry_ids, whose files hold the research notes, access detail and fill lists.
# Cadence (pipeline/ingest/ny_sprtk.py docstring): The workbook is a batch export with 1-2 month lag
#   and gaps (December 2025 is missing). Daily is plenty. The download is cached; a copy younger
#   than --max-age hours (default 20) is reused.
cadence: "daily"
