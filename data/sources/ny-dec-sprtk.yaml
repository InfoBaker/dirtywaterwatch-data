access_detail: "Live URLs https://www.dec.ny.gov/fs/data/SPRTK_Data.xlsx and .../Sewage_Discharge_Reports.xlsx 301 to extapps.dec.ny.gov, which timed out from this machine on 2026-11-01. Read instead from the Internet Archive capture of 2026-10-12 (http://web.archive.org/web/20261012004317id_/https://extapps.dec.ny.gov/fs/data/SPRTK_Data.xlsx, 11.5 MB) into the session scratchpad; parsed with a stdlib xlsx reader. Derived stats saved to raw/sprtk-workbook-stats.json. Wayback also holds captures of Sewage_Discharge_Reports.xlsx (2021-09-29, 2024-07-07, 2025-02-12, 2025-06-29, 2026-10-12)."
