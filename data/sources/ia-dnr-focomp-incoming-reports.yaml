access_detail: "Public pages, no login: a facility page per site and a page per incoming report; no list, download or feed. Minor municipal and semi-public facilities (about 930) not read yet."
machine_readable: false
legal_basis: "567 IAC 63.6 (24-hour telephone report and five-day written report of an unanticipated bypass or upset)"
