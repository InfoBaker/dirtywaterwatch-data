#   (Re-Opened), source_status (open row = still closed), authority
# Cannot fill: cause; bacteria value; coordinates (join to RIDOHGIS_Beaches_View by name); times
# Waters: Licensed salt and fresh beaches (openboatlaunch slugs: narragansett-bay-ri,
#   sakonnet-river-ri, warren-river-ri, greenwich-cove-ri)
# History: 2000-present in gid 29002208 (2025 rows lack reopen dates).
# Research notes: Sheet is an informal back end; RIDOH could change key or sharing at any time.
#   Cyanobacteria closures are mixed in with '(Cyanobacteria Advisory)' in the name.
