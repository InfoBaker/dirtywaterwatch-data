# Feed row: written by pipeline/ingest/echo_dmr_cso_states.py (data/build/events/il-echo-dmr-cso.json), the state-file route of
#   in_echo_cso_monthly (decision 45; docs/analysis/2026-11-17-echo-downloads.md, C1).
# Built 2026-11-21: EPA's Illinois DMR file per fiscal year (FY2025 and FY2026; FY2027 not yet published), the
#   119 permits with an open combined sewer outfall in the registry; lines at their registry CSO outfalls,
#   'Effluent Gross' monitoring, one-month periods, parameters that count or measure an overflow.
#   Illinois files 74062 overflows (#/mo, MO TOTAL), 82220 total flow (Mgal/mo) and, for two permits, 50037 hours;
#   quarterly lines are not read. Two limit sets at one outfall that disagree make a month in dispute (a discharge
#   month, the figure unknown).
# Real read (2026-11-21): 317 outfalls of 78 permits file such lines; 1472 outfall-months with a
#   discharge from 63 permits (2025-01 to 2026-09), 4884 filed no discharge. A median 22 days
#   from the month's end to EPA's receipt.
# Records: month precision (the monthly mark, never red or yellow; build/status.py EPA_MONTHLY_SOURCES); placed at the
#   registry outfall (point rounded to three decimals, and water; never a plant's point). Revisions and reconciliation
#   as Indiana's (in_echo_cso_monthly). Cited per figure: permit, outfall, month, parameter, value, DMR value id.
# Cannot fill: the day or hour of any discharge; an end; whether a figure is measured or modelled.
