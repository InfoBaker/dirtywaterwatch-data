# Ingester: pipeline/ingest/wi_mmsd_storm_updates.py (source id wi-mmsd-storm-updates): the news list two pages deep
#   every refresh (eight posts; the whole list on a first run), each candidate post once, again when its title or date
#   changes, when its read failed, and 30 days after its last read wherever it stands in the list; rules only.
# Read 2026-11-14 and again 2026-11-16 with the same result (the whole list, 71 pages): 281 posts on mmsd.com since 2016, 21 of them read: 18 Storm Updates or
#   overflow letters to the DNR and 3 spill or release notices, from 2018-06-22 to 2026-09-08, which give 29 dated
#   reports: 13 combined sewer overflows, 14 separate sewer overflows or overflows the post does not call combined (5
#   typed sso with the basis stated) and 2 spills at a treatment plant (plant_bypass; one says no wastewater reached
#   a water). 18 carry MMSD's volume; 3 a stated start and end to the minute; 3 name a water (Lincoln Creek twice,
#   the four separate sewer overflows of September 11-12, 2022).
# Times: the post's own stamp (Milwaukee time) is the publication; the start is the date or time the post states, the
#   storm's last day is kept apart (raw.period_end) and is never the end. 11 of the 21 posts give the overflow's own
#   date or start: posted 1 to 6 days after it (median 4); the other 10 give only the storm's dates (raw.started_after,
#   no start). The September 3, 2026 overflow was posted on September 8, the August 1 overflow on August 6.
#   A report dated to the day with no end gets the site's 72-hour caution from that day (unresolved.day_start_caution);
#   one with only the storm's dates is counted from its publication (14 days, then end not confirmed). Computed at
#   each post's publication (build/status.py event_intervals), 22 of the 29 reports are in caution: 18 give no start
#   and one a time with no end, counted from the post, and 3 were posted within their caution; 7 of them (6 dated to
#   the day, 1 with a stated end) were past their caution when posted. Every record stays in the water's history.
# Placement: a combined sewer overflow that names no water is shown on every water MMSD's permitted outfalls discharge
#   to (placement.no_outfall_all_waters); one that names a water on that water with the permit's outfalls there. A
#   separate sewer overflow with no water named is listed with MMSD and placed nowhere. No coordinates.
# Not read: the five-day letters (PDFs, often scanned images), the year-to-date counter on the rain and facility page
#   (MMSD says its figures can be corrected), the Water Drop Alert texts (pre-storm requests). The member
#   municipalities' own overflows named in a post are kept as text on MMSD's record, not as their records.
# Privacy: only titles, stamps, letter links and the article lines (cut at MMSD's standing advice block) are kept;
#   telephone numbers, e-mails and house numbers are removed.
