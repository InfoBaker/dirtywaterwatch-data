# Read by ingest/ks_kdhe_stream_advisories.py (source id ks-kdhe-stream-advisories): KDHE's news flash feed, about a month
#   of releases; "Stream Advisory Issued for ..." opens an advisory in KDHE's own window and "Stream Advisory Rescinded
#   for ..." ends it. Real fetch 2026-11-14: 42 releases (2026-10-15 to 2026-11-13), most of them boil water advisories
#   (drinking water, not read), 3 weekly blue-green algae releases (read from the HAB layer instead) and one stream
#   advisory rescission (McIntyre Creek, Tuttle Creek Reservoir, the Big Blue and Kansas rivers, 2026-10-29) whose issue
#   is older than the feed: counted, not turned into a record. The release pages and the news index answer 403 to the
#   identified client, so no older advisory can be read; the archive is what this feed keeps from its first run.
# The feed's times read -0600 in October as in November; kept as stated.
