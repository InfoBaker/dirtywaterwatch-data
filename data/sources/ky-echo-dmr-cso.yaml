# Feed row: written by pipeline/ingest/echo_dmr_cso_states.py (data/build/events/ky-echo-dmr-cso.json), the state-file route of
#   in_echo_cso_monthly (decision 45; docs/analysis/2026-11-17-echo-downloads.md, C1).
# Built 2026-11-21: EPA's Kentucky DMR file per fiscal year (FY2025 and FY2026; FY2027 not yet published), the
#   13 permits with an open combined sewer outfall in the registry; lines at their registry CSO outfalls,
#   'Effluent Gross' monitoring, one-month periods, parameters that count or measure an overflow.
#   Kentucky files monthly totals (MO TOTAL): 74062 overflows (#/mo), 50037 hours (hr/mo), 74063 million gallons;
#   Paducah and Maysville 84165 (EVNT TOT; Maysville's in N=0;Y=1, a yes-or-no observation, so no count), 81381
#   hours and 74063 at 'Effluent Gross (Supplementary)'. Louisville MSD files no CSO lines on its DMRs.
# Real read (2026-11-21): 151 outfalls of 11 permits file such lines; 1908 outfall-months with a
#   discharge from 8 permits (2025-01 to 2026-09), 1030 filed no discharge. A median 27.0 days
#   from the month's end to the report's receipt (VALUE_RECEIVED_DATE: by the permitting authority).
# Records: month precision (the monthly mark, never red or yellow; build/status.py EPA_MONTHLY_SOURCES); placed at the
#   registry outfall (point rounded to three decimals, and water; never a plant's point). Revisions and reconciliation
#   as Indiana's (in_echo_cso_monthly). Cited per figure: permit, outfall, month, parameter, value, DMR value id.
# Cannot fill: the day or hour of any discharge; an end; whether a figure is measured or modelled.
