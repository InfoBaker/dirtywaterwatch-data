# Feed row: the source id written by the ingester pipeline/ingest/nj_echo_monthly.py
#   (data/build/events/nj-echo-monthly.json). It describes the same source as the research row(s) in
#   registry_ids, whose files hold the research notes, access detail and fill lists.
# Cadence (pipeline/ingest/nj_echo_monthly.py docstring): ECHO is asked once a month per permit (a
#   run reuses the copy fetched in the same calendar month, --refresh asks again). DMRs reach ECHO
#   weeks to months after the month (median days after month end: Gloucester City 2, Paterson 14,
#   Jersey City MUA 24, Camden City 27, Newark 97). The default window starts 2024-01-01 so late and
#   revised reports are picked up.
