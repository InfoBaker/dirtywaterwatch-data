# Notes (research/ri, status used, verified fetched, checked 2026-11-01): Gives verified start/end
#   times that /pins drops after 48 h.
# Access detail (research, quoted): GET, no auth, JSON array; rendered as the table 'Verified
#   Overflow Events in the last 30 Days' on the CSO Alarm Map page. On 2026-11-01 it held one row
#   (OF 220, 2026-10-05). The endpoint name suggests dry-weather overflows; ECHO classifies the same
#   event as a dry-weather CSO.
# Can fill: started_at, ended_at, reported_at (DATE_VERIFIED), location_text (SITE_NAME),
#   source_status (verified)
# Cannot fill: volume; coordinates (join to /pins by site name); waterbody
# Waters: NBC CSO outfalls (openboatlaunch slugs: providence-river-ri, seekonk-river-ri,
#   blackstone-river-ri)
# History: 30 days only.
# Research notes: Dates are SQL-Server-style strings ('Oct 5 2026 8:50PM'), no timezone.
cadence: "Rows appear after NBC verification (here ~9 h after the event ended); rolling 30-day window."
