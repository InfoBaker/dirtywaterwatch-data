# Read 2026-11-14: the index lists the quarterly reports to EPA and LDEQ since 2002, Report 98 (July to September 2026,
#   issued October 30, 2026) the newest. Reports 91 to 98 (October 2024 to September 2026) read with pypdf's layout text.
#   A report is used only when the rows read for each collection system (North LA0036439, AI 4843; South LA0036412,
#   AI 4841) equal its own Part D summary: 93, 94, 95, 96 and 98 pass (219 discharges: 7+40, 7+32, 9+31, 15+50, 9+19);
#   91 (North's table not found), 92 (South 55 of 56) and 97 (North 23 read against 21) are withheld. The plants'
#   discharges (1 to 8 a quarter) are scanned forms with no text: counted from the summary, not itemised.
# Records: one per row, sso, status unknown (no end given), day precision in Central time (the site's caution for 72
#   hours from the start of the day: data/rules.json unresolved.day_start_caution), published_at the report's issue
#   date, the gallons given, the receiving water as written; 'None' or no water (102 of the 219 rows) kept with the parish and permit and
#   placed on no water. No address is kept. Delay: the rows are one to four months old when the report appears.
# Cannot fill: a time of day; an end; a point; the plants' discharges.
