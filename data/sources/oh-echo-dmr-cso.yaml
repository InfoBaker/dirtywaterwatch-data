# Feed row: written by pipeline/ingest/echo_dmr_cso_states.py (data/build/events/oh-echo-dmr-cso.json), the state-file route of
#   in_echo_cso_monthly (decision 45; docs/analysis/2026-11-17-echo-downloads.md, C1).
# Built 2026-11-21: EPA's Ohio DMR file per fiscal year (FY2025 and FY2026; FY2027 not yet published), the
#   66 permits with an open combined sewer outfall in the registry; lines at their registry CSO outfalls,
#   'Effluent Gross' monitoring, one-month periods, parameters that count or measure an overflow.
#   Ohio files each CSO figure (74062 overflows, 74063 overflow volume, 82517 duration) under both the daily maximum and
#   the monthly average columns: where both agree in a report with one entry, the figure is the month's (checked
#   against Columbus's own overflow table, 2026-11-21); where they differ, or the report holds daily entries, the
#   month is marked a discharge month and no count or volume is taken (the record writes the figures as filed).
#   Ohio's 51709 'Overflows' in occurrences a year (filed once, in December) and the lines at a permit's other
#   stations (Columbus's station 300) are not read.
# Real read (2026-11-21): 889 outfalls of 60 permits file such lines; 4514 outfall-months with a
#   discharge from 53 permits (2025-01 to 2026-09), 6970 filed no discharge. A median 15.0 days
#   from the month's end to the report's receipt (VALUE_RECEIVED_DATE: by the permitting authority).
# Records: month precision (the monthly mark, never red or yellow; build/status.py EPA_MONTHLY_SOURCES); placed at the
#   registry outfall (point rounded to three decimals, and water; never a plant's point). Revisions and reconciliation
#   as Indiana's (in_echo_cso_monthly). Cited per figure: permit, outfall, month, parameter, value, DMR value id.
# Cannot fill: the day or hour of any discharge; an end; whether a figure is measured or modelled.
