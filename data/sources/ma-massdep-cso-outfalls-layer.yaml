# Notes (research/ma, status used, verified fetched, checked 2026-11-01): DEP_OUTFL_ equals the
#   portal's outfallId (SPR010, HOL018, CHI03, NEW003): the join that gives every portal record a
#   point.
# Access detail (research, quoted): query?where=1%3D1&outFields=*&f=json&outSR=4326 returned all 193
#   points (raw/portal/massdep-csos-all.json). Item 0262b339c2c74213bdaaa15adccc0e96.
# Can fill: coordinates (outfall point, precision: 'estimates'), geometry(outfall point), waterbody
# Cannot fill: all event times and volumes
# Waters: all 193 permitted CSO outfalls in MA (19 permittees) (openboatlaunch slugs:
#   connecticut-river-ma, chicopee-river-ma, merrimack-river-ma, concord-river-ma, charles-river-ma,
#   mystic-river-ma, dorchester-bay-ma, massachusetts-bay-ma, lynn-harbor-ma, saugus-river-ma,
#   gloucester-harbor-ma, taunton-river-ma, acushnet-river-ma, new-bedford-harbor-ma,
#   clarks-cove-ma, nashua-river-ma, blackstone-river-ma, westfield-river-ma)
# History: Described as the 2021 CSO layer, maintained since.
# Research notes: Somerville's one outfall appears twice (MA0101982 and MA0103284). A few portal
#   outfall ids are WWTP outfalls (e.g. Lowell '035', Chicopee '010') not in this layer.
