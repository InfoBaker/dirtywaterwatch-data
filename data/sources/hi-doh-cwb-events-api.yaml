id: "hi-doh-cwb-events-api"
name: "Hawaii Department of Health water quality advisories and events (CWB portal API, eha-cloud.doh.hawaii.gov)"
url: "https://eha-cloud.doh.hawaii.gov/cwb/api/events"
homepage: "https://eha-cloud.doh.hawaii.gov/cwb/"
