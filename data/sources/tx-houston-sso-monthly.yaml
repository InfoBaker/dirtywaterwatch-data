# History enrichment, 2026-11-22: the same source and SSO identity, not a separate event feed.
# City of Houston GIS org NummVBqZSIJKUeVR; public item f10546c4604a4d38bbc397549925f0f4.
# Complete live read: 29,314 unique EXCURSIONID rows, 2018 through October 2026; all 4,494 monthly records match.
# Monthly values prevail; monthly void 67077 excludes that layer row. Union: 29,313 records. 17,563 Private System
# rows remain in scope, marked as private with no invented operator. There is no receiving-water-name field.
# UTC date epochs represent Houston dates; separate time epochs use December 1899. Decode both in America/Chicago
# before combining their local date and clock. Missing clocks keep day precision; missing ends remain absent.
# Source TOTALVOLLOST is retained as published, even when unlike GPM * DURATION (source minutes); no calculation
# of ours is made. Zero is unknown volume, not zero sewage. The fields LATITUDE/LONGITUDE are projected coordinates;
# only geometry requested with outSR=4326 supplies points, rounded to three decimals before saving.
# Cache by edit time and count; complete ordered resultOffset pages checked against the count (maxRecordCount 2000).
# A failed page preserves prior evidence and marks the source unhealthy. Disappeared rows retain original times.
