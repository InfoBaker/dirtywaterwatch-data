# Access detail (research, quoted): Status table
#   https://apps.web.maine.gov/online/healthy_beaches/public/status-table.html (HTML, filters by
#   town/management entity/region). Embedded map
#   https://experience.arcgis.com/experience/940ba30f20284848b865210b42245e5e. Program pages
#   https://www.maine.gov/dep/water/beaches/index.html and monitoring.html.
# Research notes: Threshold: 'Maine's EPA-approved Beach Action Value (or single sample maximum
#   safety threshold) for Enterococci in marine waters is 104 MPN/100 mL'. Precautionary Rainfall
#   advisories 'typically following 1 or more inches of rainfall in a 24-hour period' (some beaches
#   use 0.5 in.). Portal notice: 'It is recommended to avoid water contact for at least 24-48hrs
#   after rainfall ceases.' 'The MHB program is voluntary and is not mandated by Maine State law.
#   Monitoring coastal water quality for swimming and other water contact is the responsibility of
#   local jurisdictions.' 'A municipality must have a specific ordinance in place to close a beach.'
#   Program now run by DEP (Bureau of Water Quality, Portland office); mainehealthybeaches.org
#   redirects to DEP. EPA BEACH Act funded.
