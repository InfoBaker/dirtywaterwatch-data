# Notes (research/nj, status candidate, verified fetched, checked 2026-11-02): Clean ArcGIS feed
#   with tiers and coordinates; secondary to sewage but in scope as an advisory layer.
# Access detail (research, quoted): Dashboard item 49190166531d4e5a811c9a91e4a41677 -> web map
#   2d2c6469bba143bf9b3487170c9904aa -> layer 'HAB Alert Level' =
#   https://services1.arcgis.com/QWdNfRs7lkPq4g4Q/arcgis/rest/services/NJDEP_Production_HAB_Sampling_2021_public/FeatureServer/0
#   (HAB_sample_table, points, no auth). Query used: where=sitevisitdate>=date
#   '2026-06-01'&orderByFields=sitevisitdate DESC. Also a mobile dashboard
#   (7b91233096fc4b9ea5ef2de1a2280359) and an older public view
#   (NJDEP_Production_HAB_Sampling_public).
# Can fill: event_type (advisorytier), started_at (sitevisitdate), source_updated_at (EditDate),
#   published_at (advistorytrigdt, inferred), coordinates, waterbody, jurisdiction
# Cannot fill: ended_at (tier changes are new rows); advice_text (tiers only)
# Waters: Freshwater lakes and reservoirs statewide, sampled in response to reports (2,304 site
#   visits 2020-04-29 to 2026-10-28) (openboatlaunch slugs: manasquan-reservoir-nj,
#   spruce-run-reservoir-nj, lake-hopatcong-nj, swartswood-lake-nj)
# History: 2020-04-29 onward in this layer; 2019 locations layer separate.
# Research notes: Raw: raw/hab/. Related NJDEP items: HAB Coastal Monitoring Sites (mapsdep
#   Environmental_mon_water MapServer/37 and results table /38), Phytoplankton Monitoring Network,
#   aircraft chlorophyll/phycocyanin pages used by njbeaches.org
#   (njdep.rutgers.edu/aircraft/action_one_latest.php).
