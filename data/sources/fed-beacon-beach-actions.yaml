id: "fed-beacon-beach-actions"
name: "U.S. EPA BEACON 2.0 Beach Actions: state beach advisories and closures as filed with EPA (history)"
url: "https://beacon.epa.gov/ords/beacon2/r/beacon_apex/beacon2/beach-actions"
homepage: "https://beacon.epa.gov/ords/beacon2/r/beacon_apex/beacon2/"
kind: "csv"
level: "federal"
# Feed row: the source id written by the ingester pipeline/ingest/fed_beacon_beach_actions.py
#   (data/build/events/fed-beacon-beach-actions.json). The Beach Actions report and its detailed report for the
#   current and the previous calendar year, one report-builder session per year (four application-process posts,
#   then each report's ?request=CSV), at most once every 7 days from November through March and every 30 days
#   from April through October; the records are written again each hour from the
#   saved rows. States file after the season (by January 31 of the next year): every record is history only
#   (data/rules.json unresolved.history_only) and never colours the map now. Out of scope: AS, GU, MP, VI and the
#   tribal programs BR, GP, MK, ST (counted in meta). The beach points and waters come from data/beaches-epa.json
#   (scripts/build_epa_beach_registry.py). The Beach Contact Information report is never read (it names staff).
# Legal basis: the BEACH Act of 2000 (Clean Water Act section 406, 33 U.S.C. 1346) requires states that take BEACH
#   Act grants to notify the public of exceedances and to report to EPA; EPA's National Beach Guidance and Required
#   Performance Criteria for Grants (2014), performance criterion 4 (report monitoring results to the public and to
#   EPA at least annually) and criterion 8 (notification reports to EPA).
cadence: "31 days (a pull every 7 days from November through March, every 30 days from April through October)"
license: "U.S. EPA data: public domain."
attribution: "U.S. EPA BEACON 2.0, as reported by each state's beach program"
enabled: true
role: "advisories"
event_types: ["beach_closure", "beach_advisory"]
states: ["AK", "AL", "CA", "CT", "DE", "FL", "GA", "HI", "IL", "IN", "LA", "MA", "MD", "ME", "MI", "MN", "MS", "NC",
         "NH", "NJ", "NY", "OH", "OR", "PA", "PR", "RI", "SC", "TX", "VA", "WA", "WI"]
registry_ids: ["fed-beacon2-beach-actions-reports"]
access: ["csv"]
access_detail: "GET .../report-page-content (the page carries APP_SESSION); POST /ords/beacon2/wwv_flow.show with p_flow_id=132, p_flow_step_id=0, p_instance=<session> and p_request=APPLICATION_PROCESS=clearLocationLists, setAdditionalSearchVariables (UI_EPA_REGION=11, national), buildFilters, setAdditionalSearchVariables (F101_CALENDAR_YEAR=<year>); then GET .../beach-actions?clear=Y&session=<session> and .../beach-actions?session=<session>&request=CSV (and the same for beach-actions-detail). The pipeline's named client; about one second between requests."
machine_readable: true
legal_basis: "BEACH Act of 2000, Clean Water Act section 406 (33 U.S.C. 1346); EPA National Beach Guidance and Required Performance Criteria for Grants (2014), performance criteria 4 and 8"
checked: "2026-11-21"
