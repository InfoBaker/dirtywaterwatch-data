machine_readable: false
legal_basis: "Consent decree, United States v. City of Bangor, No. 1:15-cv-00350-NT (D. Me., entered 2015-11-13; first modification January 2016): annual report on compliance with an SSO event log. Posting the reports on the City's site is voluntary."
