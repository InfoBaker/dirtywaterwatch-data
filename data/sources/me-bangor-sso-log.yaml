# Notes (2026-11-21, sources research follow-up): every sanitary sewer overflow the City found each calendar year
#   (4 to 11 a year; 72 rows for 2016 to 2024), appendix E or F of the yearly Annual Report on Compliance under the
#   2015 consent decree. The page and the reports answer GitHub's runner (200).
#   The 2016 to 2022 logs are rotated scans (2021 has no text layer), so the rows are transcribed by two independent
#   readings into data/reference/bangor-sso-log-2016-2024.csv, without the location column (street addresses).
# Can fill: started_at (reported or discovered; minute where printed), ended_at (stopped), volume (one number where
#   given), cause, final disposition, the water where the disposition names one (Penobscot River, Kenduskeag Stream)
# Cannot fill: coordinates (the location is a street address and is not kept); the water for "ground", basements,
#   storm drains and ditches; Birch Stream and Penjajawoc Stream have no water record yet
cadence: "Yearly, dated January 31 for the year before; the 2025 report was not listed on 2026-11-21."
