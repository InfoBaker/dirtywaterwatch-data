# Notes (research/pr, status used, verified fetched, checked 2026-11-14): Read by
#   scripts/add_pr_cso_outfalls.py on 2026-11-14: the 12 Puerto Nuevo combined sewer outfalls
#   (PR0021555) with PRASA's points and receiving waters (data/outfalls-pr.json), each paired with
#   EPA's inventory row; EPA gives no point for outfall 003 and a wrong longitude for 010.
# Access detail (research, quoted): query?where=1%3D1&outFields=*&f=json returns 12 features (Web
#   Mercator). Feeds the Experience Builder app 'Sistema de Alcantarillado Combinado' (item
#   f157b11700644d1fb0286809f384f457, public, created 2026-03) embedded at
#   acueductos.pr.gov/en-us/combinado/mapa-de-ubicacion-csos. Other service folders on the server
#   need a token. Sample: research/pr/raw/cso-data-sample.json.
# Can fill: coordinates (outfall), waterbody, location_text
# Cannot fill: any event field
# Waters: San Juan Bay, Rio Puerto Nuevo, Canal Martin Pena (Puerto Nuevo system)
