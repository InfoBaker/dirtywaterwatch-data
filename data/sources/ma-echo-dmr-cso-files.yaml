# Feed row: written by pipeline/ingest/echo_dmr_cso_states.py (data/build/events/ma-echo-dmr-cso-files.json), the state-file route of
#   in_echo_cso_monthly (decision 45; docs/analysis/2026-11-17-echo-downloads.md, C1).
# Built 2026-11-21: EPA's Massachusetts DMR file per fiscal year (FY2025 and FY2026; FY2027 not yet published), the
#   16 permits with an open combined sewer outfall in the registry; lines at their registry CSO outfalls,
#   'Effluent Gross' monitoring, one-month periods, parameters that count or measure an overflow.
#   Massachusetts permits beyond Springfield, Holyoke and Chicopee (ingest/echo_cso_dmr_monthly.py reads those):
#   51484 events, 81381 or 50037 hours, 82220 flow, at 'Effluent Gross' and 'Storm Water' (Region 1 puts CSO lines
#   there); daily maximums and rates (gal/d) mark the month only.
# Real read (2026-11-21): 23 outfalls of 5 permits file such lines; 74 outfall-months with a
#   discharge from 4 permits (2025-01 to 2026-09), 409 filed no discharge. A median 14.0 days
#   from the month's end to the report's receipt (VALUE_RECEIVED_DATE: by the permitting authority).
# Records: month precision (the monthly mark, never red or yellow; build/status.py EPA_MONTHLY_SOURCES); placed at the
#   registry outfall (point rounded to three decimals, and water; never a plant's point). Revisions and reconciliation
#   as Indiana's (in_echo_cso_monthly). Cited per figure: permit, outfall, month, parameter, value, DMR value id.
# Cannot fill: the day or hour of any discharge; an end; whether a figure is measured or modelled.
