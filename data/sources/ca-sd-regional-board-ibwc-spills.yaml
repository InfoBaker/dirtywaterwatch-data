# Notes (research/ca, verified fetched, checked 2026-11-03; ingested from 2026-11-15 by
#   pipeline/ingest/ca_sd_tijuana_table.py): the shared US-Mexico water; a small HTML table the Board updates
#   "if needed, approximately once a week".
# What the feed reads: every row of the table (Start Date, End Date, Event Type, Discharge Location, Approximate
#   Discharge Volume, Volume Recovered, Notes), one record per row: the dates as given (day precision, Pacific);
#   "Ongoing ..." as ongoing with no end; a blank or unreadable end as no end; an end before the start kept and not
#   used; the type by a fixed rule on the table's wording (Spill Event, dry weather Canyon Collector Transboundary
#   Flow Event, Tijuana River Transboundary Flow Event, each a sewage discharge); the volume and the volume
#   recovered; the notes. A Spill Event is joined to USIBWC (permit CA0108928); a flow from Mexico that is not one
#   joins no operator.
# What it leaves out: the table gives no coordinates, no record identifier, no report or posting date and no time
#   of day, so none is used (the record key is the row's start date and location). Events before July 2024 are in
#   the Board's Executive Officer's Reports (November 2021 to September 2024), not read. USIBWC's e-mail alerts and
#   its Tijuana River flow gauge (waterdata.ibwc.gov) are not read.
# Waters: Tijuana River, Smuggler's Gulch, Goat Canyon, Stewart's Drain, Silva Drain, Canyon del Sol. A record is
#   placed only on a water record of that name in the Tijuana River valley; none was on file when the feed started,
#   so the records are listed unplaced (rows proposed in research/ca/tijuana-water-records-proposed.json).
