# Feed row: the source id written by pipeline/ingest/notification_pages.py (2026-11-03). It fetches every
#   monitored row of data/notice-channels.json once a refresh (the register of public-notice channels per
#   operator or agency, by law, permit or voluntarily; New Jersey's 25 CSO permits first), keeps a snapshot
#   per page in data/build/notice-pages/, and turns a dated overflow notice that newly appears on a page
#   into a record (time_precision "day"); boilerplate, the shared site's wording and text already on the
#   previous snapshot never make records. Its page-health table (data/build/notice-pages/health.json) is
#   carried in out/coverage.json as states.<ST>.notification_pages.
# States: New Jersey's rows only so far; add each state here when its register rows are monitored.
