# Feed row: written by pipeline/ingest/tn_kub_sso_log.py (data/build/events/tn-kub-sso-log.json).
# Built 2026-11-17: hourly. The page loads its rows by month from
#   https://www.kub.org/api/ams/v1/customer-sso-logs?date[]=<first>:greaterThanOrEquals&date[]=<last>:lessThanOrEquals&sort=date
#   (JSON: date, time, location, volume, status, completionDate). 2,080 rows from January 2005 on 2026-11-17 (57 to 67
#   a year since 2023; 64 in 2026, the newest 2026-10-19). The hourly run asks the previous and the current month;
#   --backfill asks each month from 2023-01-01, the reach kept for comparable statewide lists (as Texas's TCEQ table).
# The page's own words (its content record, /services/forms/3869): "The chart below shows the date and location of
#   overflows, which are added within 24 hours of when they are reported, and the status of cleanup efforts. ... If a
#   month is not shown, no incidents occurred that month." Status ("Complete", "New") and Completion are the cleanup's,
#   kept as such and never read as the end of the overflow: each record has no end (status unknown).
# Times: the date and time as the page shows them in Knoxville (Eastern time); a row with no time is a date.
# Volume: "Gallons" as written; "Unknown" or blank is no volume.
# Place: no water, no point, no permit: each record is listed with its street and KUB's service area (Knox County)
#   and placed on no water (never geolocated from the street).
# One event, one record: KUB's overflows also reach TDEC's Events Report (tn-tdec-events-report, refused to automated
#   reading since 2026-11-07); a KUB record of the same day and street as a TDEC record of a KUB permit is its duplicate.
# Privacy: the location is a street address, often a home: the house number is removed. No name, phone or e-mail.
cadence: "1 hour"
