access_detail: "GET https://www.kub.org/api/ams/v1/customer-sso-logs with date[]=<YYYY-MM-DD>:greaterThanOrEquals and date[]=<YYYY-MM-DD>:lessThanOrEquals (a minimum is required: 422 without it) and sort=date; no key, no sign-in. 200 to this build's client and to GitHub's runner (run 43971238548)."
machine_readable: true
legal_basis: "None for the page (voluntary). Tenn. Comp. R. & Regs. 0400-40-05-.07(2)(o): the report to TDEC within 24 hours."
