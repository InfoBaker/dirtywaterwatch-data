id: "in-idem-cso-outfall-layer"
name: "IDEM Indiana CSO Outfall Map (ArcGIS hosted layer)"
url: "https://services5.arcgis.com/w1CjlfkUGYWS5MJd/arcgis/rest/services/CSO_Locations_Map_WFL1/FeatureServer/0"
homepage: "https://www.in.gov/idem/cleanwater/information-about/combined-sewer-overflow-cso-program/indiana-cso-outfall-map"
kind: "arcgis"
level: "state"
# Registry rows: scripts/build_in_outfalls.py -> data/outfalls-in.json (outranks EPA's rows for the same permit and
#   outfall; EPA's rows stay, named in supersedes).
# Fetch 2026-11-14: 981 points on 110 permits; Active 578, Inactive 318, 'Active, Discharge Prohibited' 85; Untreated
#   CSO 938, Treated CSO 41, one sanitary overflow point, one blank; 136 points have no geometry (131 Inactive). 845
#   rows written (106 permits), 835 paired with EPA's inventory rows; 591 carry EPA's water tie (IDEM's point within
#   500 m of EPA's) until the water batch ties IDEM's points. EPA lists 39 open outfalls IDEM's layer lacks (kept as
#   EPA's rows). The layer gives each outfall's receiving stream and the chain of waters downstream (to the Wabash,
#   the Ohio, Lake Michigan), its county, basin and watershed.
# Columns excluded: Photo_Credit (people's names) and GlobalID are never asked for. House numbers in IDEM's location
#   text are cut.
cadence: "edited by IDEM as permits change (data last edited 2026-10 per the layer's editing info)"
license: "No licence statement on the service"
attribution: "Indiana Department of Environmental Management"
enabled: true
role: "outfalls"
event_types: ["cso"]
states: ["IN"]
registry_ids: ["in-idem-cso-outfall-layer"]
access: ["arcgis"]
access_detail: "FeatureServer layer 0 'CSOLocations_XYTableToPoint1', maxRecordCount 2000, no token; fields OBJECTID, Agency_Interest_ID, City, NPDES_Number, CSO_Number, Receiving_Stream, waterbody_desc_2 to 4, Status, County, Basin, Sub_Basin, Watershed, Wastewater_Type, X_Coordinate, Y_Coordinate, Photo_Credit, GlobalID."
machine_readable: true
legal_basis: null
checked: "2026-11-14"
