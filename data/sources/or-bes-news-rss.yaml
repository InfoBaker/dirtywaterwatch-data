kind: "rss"
level: "operator"
# Ingester: pipeline/ingest/or_bes_news.py (source id or-bes-news-rss): the feed every refresh, each advisory's page
#   once (again when BES updates it), rules only.
# Read 2026-11-07: 25 items, 13 of them sewage advisories (4 CSO Advisories, 9 sewage releases) from 2025-11-21 to
#   2026-10-22, 14 records (one advisory reports two releases). The other 12 items (rates, traffic advisories,
#   projects, a release of treated effluent for which BES advised no precautions) are not read.
# Times: each page's Published and Updated (Portland time); the start and end from the text (the overflow's stated
#   start, the time crews responded, or the day only). The RSS pubDate follows the page's last update (the
#   2025-12-18 CSO advisory's pubDate is its expiry) and is never the start. The four CSO advisories were published
#   0.4, 2.2, 2.8 and 13.9 hours after the overflow began; the sewage releases 3.7 to 33.5 hours after (one update a
#   month later).
# The City's window: a CSO advisory, and a sewage release to the Willamette, says "Avoid contact with the river in the
#   affected area during the overflow and for 48 hours after it stops" (6 of 14 records): the authority's own red. A
#   CSO advisory's stretch: "the Willamette River downstream of the Ross Island Bridge".
# Privacy: the pages' contact block (the public information officer) and everything after the article are cut before
#   anything is kept; house numbers and telephone numbers are removed.
# No coordinates; the Big Pipe Tracker gauge and the GovDelivery e-mail list are separate channels (the register).
cadence: "Issued during the event: a CSO advisory within about half an hour to 14 hours of the overflow's start; updated when the overflow ends and the advisory expires (48 hours after)."
