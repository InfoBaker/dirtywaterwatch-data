notes: "Eastern wall-clock values encoded as UTC. Midnight values conservatively have day precision; INCDNTDATE is the fallback date. Creation is entry, not publication or receipt. Estimated discharged gallons and recovered gallons are separate. Explicit secondary effluent stays in sanitized raw snapshots and is excluded from sewage events. Cause codes are retained as published; the layer has no domains. DEP overlaps are linked, with one DEP notice counted and both sources cited. Named-water placement only; generic CANAL never selects a nearby water. Contact, street-address and narrative fields are excluded; points rounded before saving."
