# Notes (2026-11-17, sources research follow-up): the only public dated overflow record for Maine. The yearly
#   "CSO Activity and Volumes" workbooks the City of Portland and PWD file with DEP, as received by CBEP from PWD
#   staff for the 2020 State of the Bay report, with CBEP's merged file of 2015 to 2019. 2016 to 2018 in the merged
#   file equal the workbooks; 2019 is read from the workbook because the merged file drops the storm of
#   2019-12-13 to 2019-12-15 (filed as 2020; 56.5 million gallons). Yearly sums against DEP's status report
#   (Portland & PWD, million gallons): 2015 221.1 / 254.7 (five outfalls not metered in 2015), 2016 318.4 / 318.4,
#   2017 165.0 / 175.7, 2018 290.5 / 283.6, 2019 185.1 / 184.5.
# Can fill: started_at and ended_at (the storm's first and last day), outfall, volume per outfall and storm,
#   permit (by outfall number), coordinates and water (outfall registry), published_at (the archive commit)
# Cannot fill: the day or time an outfall discharged within a storm; duration; reported_at; float-block trips
#   with no metered volume (not in CBEP's file); anything after 2019
# Waters: casco-bay-me (every outfall the registry places), per data/outfalls-new-england.json
cadence: "Static archive: 2015 to 2019; the repository has not changed since 2021-12-03 (commit 99cadaab)."
