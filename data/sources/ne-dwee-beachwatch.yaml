id: "ne-dwee-beachwatch"
name: "Nebraska DWEE Beach Watch: MonitoredBeachAlert (ArcGIS)"
url: "https://dweegis.nebraska.gov/weesr/rest/services/MonitoredBeachAlertNDEE/FeatureServer/0"
homepage: "https://dwee.nebraska.gov/node/4996"
kind: "api"
level: "state"
# Read through the generic ArcGIS reader (docs/generic-ingesters.md) with the hook ingest/ne_transforms.py
#   (ne_beachwatch_record). The layer holds every weekly sample of the season at 57 public beaches; only the rows
#   with a health alert or an elevated E. coli label are asked for.
# Real fetch 2026-11-07: 1,022 rows, all of the 2026 season (sample weeks 20 to 37, 2026-05-18 to 2026-09-14), 57
#   stations; 20 rows on health alert (microcystin above 8 micrograms per litre: Rockford Lake, Maskenthine Reservoir,
#   Cub Creek Lake, Big Indian Lake, Iron Horse Trail Lake, Kirkman's Cove Lake, Maple Creek Recreation Area Lake), 38
#   with the elevated E. coli label (one row has both): 57 records. Dates are stored as midnight Central time
#   (05:00 UTC in summer); read as dates.
# Not in the layer: the time a sample was posted (Fridays, by the agency's release), the lift of an alert (the next
#   week's row is the next statement), earlier seasons.
cadence: "weekly in season: samples taken Mondays, posted Fridays, mid-May to mid-September"
license: "No licence statement on the service"
attribution: "Nebraska Department of Water, Energy, and Environment, Beach Watch"
enabled: true
role: "advisories"
event_types: ["hab_advisory", "beach_advisory"]
states: ["NE"]
access: ["arcgis"]
access_detail: "https://dweegis.nebraska.gov/weesr/rest/services/MonitoredBeachAlertNDEE/FeatureServer/0/query?where=1%3D1&outFields=*&f=json (no auth). Backs the Beach Watch Experience; fields StationID, StationName, Latitude, Longitude, SampleWeek, ActivityStartDate, EColi, Microcystin, HealthAlert, EColiRisk, HealthDescription."
machine_readable: true
legal_basis: null
checked: "2026-11-07"
fetch:
  platform: "arcgis"
  live: true
  url: "https://dweegis.nebraska.gov/weesr/rest/services/MonitoredBeachAlertNDEE/FeatureServer/0"
  where: "HealthAlert = 'YES' OR EColiRisk LIKE 'Elevated%'"
  metadata: true
  time_zone: "America/Chicago"
  bounds: [-104.1, 39.9, -95.3, 43.1]
  # the layer is emptied or reloaded between seasons: an empty or short answer is the season, not a failure (the
  #   records already read stay, marked missing from the layer)
  min_rows_ratio: 0.0
  safe_fields: [OBJECTID, StationID, StationName, Latitude, Longitude, SampleYear, WeekNumber, ActivityStartDate,
                EColi, Microcystin, HealthAlert, EColiRisk, HealthDescription]
  reviewed_fields:
    StationName: "the beach's name ('Rockford Lake at Beach'), never a person"
  record:
    source_record_id: {template: "{StationID|upper}-{SampleYear}-w{WeekNumber}"}
    started_at: {field: ActivityStartDate, parse: epoch_ms, midnight: date}
    event_type: {const: unknown}
    lat: {field: Latitude, parse: number}
    lon: {field: Longitude, parse: number}
    outfall_name: StationName
    waterbody_text: {field: StationName, regex: "^(.*?)(?:\\s+at\\s+.*)?$", replace: "\\1"}
    authority: {const: "Nebraska Department of Water, Energy, and Environment (Beach Watch)"}
    source_url: {const: "https://dwee.nebraska.gov/node/4996"}
  transform: "ingest.ne_transforms.ne_beachwatch_record"
  decoded_times: {parse: epoch_ms, fields: [ActivityStartDate]}
  dedupe: {repeats: suffix, order: [started_at]}
  history:
    keep_missing: true
  meta:
    credit: "Nebraska Department of Water, Energy, and Environment, Beach Watch"
    license: "No licence statement on the service"
    caveat: "A health alert is the agency's statement for the week of the sample; the layer does not say when an alert is lifted. DWEE issues no advisory for E. coli; the elevated E. coli label is shown as a caution."
    time_basis: "Sample dates (the layer stores each as midnight Central time); no time of day is given."
