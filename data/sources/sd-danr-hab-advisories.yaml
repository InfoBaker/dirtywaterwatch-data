# Read by pipeline/ingest/sd_danr_hab_advisories.py (2026-11-07): one hab_advisory record per lake line of the page's
#   "Harmful Algal Bloom Advisories <year>" box, dated to the day, active until the end of that calendar year (DANR's
#   own rule on the page); no coordinates, placed by the lake's name.
# Notes (research/sd, status used, verified fetched, checked 2026-11-07): DANR's HAB page now opens
#   with a box "Harmful Algal Bloom Advisories 2026" listing each lake under advisory with its
#   county and a date (five lakes on 2026-11-07: Twin Lakes, Spink County, 6/15/2026; Wall Lake,
#   Minnehaha County, 8/11/2026; Clear Lake, Hamlin County, 8/18/2026; Lake Poinsett, Hamlin County,
#   9/15/2026; Lake Albert, Kingsbury County, 9/15/2026); "Advisories expire at the end of the
#   calendar year". Read by the sd-danr-hab-advisories ingester. The yearly advisory map layers stop
#   at 2024 (2024: 3 rows, e.g. Brant Lake, microcystin 9.46 above 8 ug/L), and DANR warns its map
#   'does not show current conditions'.
