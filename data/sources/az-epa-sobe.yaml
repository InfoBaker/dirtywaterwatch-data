# Read by the national module pipeline/ingest/echo_sewer_overflow_events.py (source id echo-sewer-overflow), Arizona
#   permits added 2026-11-07, and the Navajo Nation's permits (NN...) for reports whose point lies in Arizona:
#   times with Phoenix offsets (the Navajo Nation's with Denver's), ADEQ waterbody identifiers named from
#   data/reference/az-adeq-wbids.json, washes and canals read as waters, denials, plant ponds and bypasses held
#   at the plant not, a point shared near the plant not used as the spill's, free text scrubbed.
# Notes (research/az, status used, verified fetched, checked 2026-11-07): Read by the national eRule
#   module (echo-sewer-overflow) with Arizona in its states since 2026-11-07: times in Phoenix time
#   (the Navajo Nation's in its own daylight-saving time), ADEQ waterbody identifiers named, washes
#   and canals read as waters, a shared point near the plant not used as the spill's. 2026-11-04
#   extract: 288 reports under Arizona permits from 42 permits and 52 Navajo Nation reports located
#   in Arizona; 55 kept as reaching a water (27 SSO, 28 bypass), 285 dropped (257 with no evidence
#   the sewage reached a water, 17 building backups, 10 bypasses held in the plant's ponds, lagoon
#   or grounds, 1 naming only the plant's lagoon).
# Access detail (research, quoted): Daily ZIP from ECHO (no auth). On 2026-11-07 the current-version
#   ZIP (Last-Modified 2026-11-05) held only its metadata, so the module reads the current version
#   of each report from the all-versions ZIP (all_sewer_overflow_and_collection_systems_tables.zip,
#   2026-11-04 extract). Tables: report and event (start/end datetime, duration, volume, lat/lon,
#   structure type, description), types, receiving waters, causes, impacts, corrective actions;
#   collection-system permits.
# Can fill: event_type, started_at, ended_at, reported_at (received date), coordinates, volume (44
#   of 288), location_text, authority, source_record_id (event key), raw_record
# Cannot fill: waterbody (mostly blank); advice_text; published_at (ECHO file date only); timezone
#   (not stated; see notes)
# Waters: 42 AZPDES permits statewide; receiving water on 25 of 288 events (otherwise blank or an
#   ADEQ assessment-unit code such as AZ15070101-210)
# History: 2019-09 to date (288 events: 2019 5, 2020 16, 2021 41, 2022 28, 2023 49, 2024 61, 2025
#   35, 2026 53 by received year)
# Research notes: 2026-11-04 extract: starts 2019-09-24 to 2026-10-28, received 2019-09-26 to
#   2026-10-30, a median 3 days after the start (90th percentile 10). Volume on 44 of 288 reports,
#   coordinates on 285, an end on 287. Receiving-water entry on 25 reports (24 naming a water; one
#   is UNK_PERNL), mostly as ADEQ waterbody identifiers (AZ15060202-421), which ADEQ's WBID layers
#   name (Unnamed Trib to Munds Creek). Most reports give the plant's point (Grand Canyon South Rim
#   30 of 32 at one point). Timestamps carry no zone: read as America/Phoenix (no daylight time).
#   Pima County (Tucson) has no reports, though EPA's collection-system table lists its systems;
#   APP-only collection systems are not in this table. The Navajo Nation's permits (NN..., EPA
#   Region 9) file here too: 56 reports, 52 located in Arizona (2024-02 to 2026-10), naming washes
#   such as Black Creek Wash and Moenkopi Wash.
cadence: "EPA refreshes daily. Arizona rows (2026-11-04 extract): 288 reports from 42 Arizona permits, SSO 264 and bypass 24, received a median 3 days after the start (90th percentile 10 days); and 52 Navajo Nation reports located in Arizona. Newest row: an SSO that started 2026-10-28 00:40 and was received 2026-10-30."
