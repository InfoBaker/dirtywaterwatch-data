access_detail: "ASP.NET list at https://derns.dnrec.delaware.gov/Pub/RecentReleases.aspx (no login; paging and the substance search by postback); each release's detail page by GET at Pub/ReleaseDetail.aspx?ReleaseID=<query key> (the key differs from the displayed release number)."
machine_readable: false
legal_basis: "7 Del. C. 6002(20), 6014(b) and 6028(a): sewage releases of 10,000 gallons or more reported to DNREC at once and posted by DNREC within one business day; permitted discharges exempt"
