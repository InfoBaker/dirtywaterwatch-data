# Ingester: pipeline/ingest/de_dnrec_derns.py (source id de-dnrec-derns-recent-releases), rules only.
# Read 2026-11-14: the list of every release of every substance (748 pages of ten, about 7,480 releases since 2002);
#   ten substance searches (SEWAGE, SEWER, SANITARY, SEPTIC, WASTEWATER, WASTE WATER, GREY WATER, GRAY WATER,
#   EFFLUENT, MIXED LIQUOR) gave 1,482 candidate releases, each detail page read once (1.5 s apart). Kept 1,295 sewage
#   reports, 2002-03-15 to 2026-10-18 (25 to 43 a year since 2017; 15 in 2026): 565 by a substance naming sewage,
#   688 wastewater tied to a sewer system by the facility, location or notes, 42 untreated or partially treated
#   wastewater. Dropped: 78 industrial or commercial wastewater, 101 wastewater nothing ties to a sewer system, 8
#   treated effluent. Types: 1,248 sso, 44 plant_bypass, 3 cso (notes naming combined sewers, 2003-2007).
# Times: Release Date/Time to the minute (2 at midnight, read as the day), Eastern; Report Date/Time a median of 24
#   minutes later. No end, no posting time: Release Duration and Status ("Final" on every row) are kept in raw only.
# Water: the form's Released To boxes: 815 ground only, 474 water, 6 none; 103 releases name a water in DNREC's notes
#   (10 of them while the form says ground only: placed by the text with the site's caution only).
# Quantity: 916 in gallons (median 250; 73 of 10,000 or more), 36 other text. County from ZIP or town for all but 153;
#   930 releases name no operator ("spill location", "roadway"); 16 at private homes keep their county and town only.
# Privacy: Contact Name, Phone, Email and Facility Address never read; house numbers, telephone numbers, e-mails and a
#   name after a contact verb or honorific removed before anything is saved.
cadence: "Posted within one business day of the report (7 Del. C. 6028(a)); the first three pages read hourly, at most 40 detail pages a run."
license: "none stated"
attribution: "Delaware Department of Natural Resources and Environmental Control"
enabled: true
