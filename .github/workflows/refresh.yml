name: Refresh data
# Hourly (off the hour: GitHub delays runs queued at :00): pull every feed, compute statuses and reaches, build
# charts, export, push the live files to R2 current/ for the site, save the pipeline state, and once a day attach
# the full dataset to the rolling "latest" release (a dated release on Sundays; due when the run starts in the 03Z
# hour). A file at R2 state/PAUSE (the site's publish workflow reads the same switch) pauses it: nothing is collected,
# published or saved. Standard hosted runners are free on a public repository. The ingesters keep state between runs
# (history and snapshot files in data/build), so that folder is restored from R2 state/build.tar.gz at the start and
# saved back at the end. R2 keeps no versions, so before the save a history guard compares the records per source
# with the restored state (a source that lost records holds the restored archive at state/held/), and the day's first
# save is also copied to state/daily/ (a ring of seven) and the month's to state/monthly/ (scripts/state_paths.py: what
# is kept, the cost, how to roll back). The answers the code reads back from data/raw (NHD, NLDI and Overpass answers, the Census outlines, IEM rainfall, the RI layers, the DC
# boundary, the NY workbook, this month's NJ ECHO answers: scripts/state_paths.py lists them with the reasons) are
# state/raw-cache.tar.gz, restored after it and saved with it. Every other raw fetch stays on the runner (bulk raw
# saves can carry personal fields and are never saved or committed). openboatlaunch's water records and outlines
# come from its API (scripts/state_paths.py fetch-obl: the national bulk file, at most once a day, key OBL_API_KEY)
# into ../openboatlaunch/out, where the pipeline reads them (build/status.py), else from the last good copy in R2
# (state/obl-water.tar.gz); the hourly changes check (make obl-sync, the refresh's first stage) brings the folder up
# to date, and the folder is saved back to R2 when the API changed it. Without either the run goes on without the
# outlines (a warning). Each state object is capped at 200 MB
# (the raw caches are not saved over it; the build state warns over it and is still saved up to wrangler's limit).
# Needs the CLOUDFLARE_R2_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (R2 objects in dirtywaterwatch-data through R2's S3
# endpoint, scripts/r2-s3-keys.sh: the state, and the inbox/ files the private site repository writes, the e-mail
# notice lists and the Worker's NBC file, pipeline/inbox.py; the state assessments the weekly ATTAINS job saves,
# state/attains.tar.gz, read only; the refresh reads no D1 and no raw mail), for the model steps
# OPENROUTER_API_KEY (without it they run rules-only), and for openboatlaunch's API OBL_API_KEY (without it, or with
# the API down, the R2 copy is used as before).
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Ingest modules to run once with --backfill before the refresh, space-separated (e.g. nc_dwr_sso nc_algal_blooms fl_dep_pnp); their history then lives in the saved state"
        required: false
        default: ''
  schedule:
    - cron: '7 * * * *'   # hourly, off the hour (enabled 2026-11-04 after run 3 restored the seeded state and uploaded)

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # to publish the dataset release; the workflow commits nothing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # 100 until 2026-11-22: the refresh reached 96 to 100 minutes after the history feeds landed
    # The secrets are given to the steps that use them, never to the job (security review 2026-11-17 #12): the
    # actions and the installs of the Python packages, wrangler and poppler run without them. CLOUDFLARE_API_TOKEN is
    # the secret CLOUDFLARE_R2_TOKEN (R2 objects in dirtywaterwatch-data through R2's S3 endpoint; nothing else since
    # 2026-11-18); scripts/r2-s3-keys.sh writes the S3 keys derived from it to the job's environment for the steps
    # after it. CLOUDFLARE_ACCOUNT_ID also goes to each step that runs wrangler, whose filter takes it out of the log.
    # Actions are pinned to a full commit (the version in the comment), wrangler and the Python packages to exact
    # versions (pipeline/requirements.txt).
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Dataset release due (decided from the run's own start time)
        id: release
        # the daily release is the scheduled run that starts in the 03Z hour (a dated one on Sundays); a dispatch always
        # releases. Decided here, at the start, from the clock (github.run_started_at is no context property, so the old
        # condition never held), so a run that takes past the hour still releases (SOL wave1 P2-13)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          hour=$(date -u +%H); dow=$(date -u +%u)
          due=0
          if [ "$EVENT" = workflow_dispatch ]; then due=1
          elif [ "$EVENT" = schedule ] && [ "$hour" = 03 ]; then due=1; fi
          weekly=0; [ "$due" = 1 ] && [ "$dow" = 7 ] && weekly=1
          echo "due=$due" >> "$GITHUB_OUTPUT"; echo "weekly=$weekly" >> "$GITHUB_OUTPUT"
          echo "dataset release: due=$due weekly=$weekly ($EVENT, $(date -u +%FT%TZ))"
      - name: Secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { persist-credentials: false }   # nothing here pushes; the release uses GH_TOKEN
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: 22 }
      # requirements.txt carries shapely, which also places South Dakota's EPA overflow reports in the Mountain or Central
      # zone by their points (data/reference/sd-mountain-time-counties.json, committed; nothing to fetch here)
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - run: npm install -g wrangler@4.158.0 && sh scripts/wrangler-guard.sh   # every later wrangler call is filtered (no account name in the log)
      - run: sh scripts/r2-s3-keys.sh   # R2 objects through R2's S3 endpoint: the token is limited to the pipeline's buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pause switch (R2 state/PAUSE, shared with the site's publish workflow)
        id: pause
        # set: nothing is collected, published or saved this run (every later step is skipped and the run succeeds);
        # not set: the run goes on; could not be checked: the run stops, so a pause is never missed (SOL wave1 P2-9)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rc=0; python3 -I scripts/state_paths.py fetch state/PAUSE pause.check || rc=$?
          rm -f pause.check
          case "$rc" in
            0) echo "paused=1" >> "$GITHUB_OUTPUT"
               echo "::notice::R2 state/PAUSE is set: nothing is collected, published or saved this run" ;;
            3) echo "R2 state/PAUSE is not set" ;;
            *) echo "::error::R2 state/PAUSE could not be checked; nothing is collected, published or saved this run"; exit 1 ;;
          esac
      - name: System tools (pdftotext, for MWRD's table of reversals to Lake Michigan)
        # ingest/il_mwrd_lake_reversals.py reads the PDF with poppler's pdftotext; without it that feed writes ok=False
        # and keeps its previous records, so a failed install warns and never stops the run
        if: steps.pause.outputs.paused != '1'
        env:
          AWS_ACCESS_KEY_ID: ''       # no storage keys here (scripts/r2-s3-keys.sh put them in the job's environment)
          AWS_SECRET_ACCESS_KEY: ''
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null \
            || echo "::warning::poppler-utils could not be installed; MWRD's reversals table is not read this run"
      - name: Restore pipeline state from R2
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # a missing object is a first run; one that is there but cannot be fetched or unpacked stops the run here, so
          # nothing is published without the history and the blocklist and the stored state is never saved over.
          # unpack-build checks the whole archive first: data/build members only, no links or special files (SOL
          # wave1 P2-14); one that holds anything else is refused whole, before the checkout changes
          rc=0; python3 -I scripts/state_paths.py fetch state/build.tar.gz build.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack-build build.tar.gz || { echo "::error::state/build.tar.gz could not be unpacked; nothing is published or saved this run"; exit 1; }
            # kept, with its records per source, for the history guard before the save (held in R2 when a source
            # lost records; scripts/state_paths.py guard)
            mv build.tar.gz restored-build.tar.gz
            python3 -I scripts/state_paths.py counts data/build restored-counts.json \
              || echo "::warning::the restored records could not be counted; the history guard counts the kept archive instead"
          elif [ "$rc" = 3 ]; then
            echo "no state yet"
          else
            echo "::error::state/build.tar.gz is in R2 but could not be fetched; nothing is published or saved this run"; exit 1
          fi
          find data/build -name '._*' -delete 2>/dev/null || true   # AppleDouble files from a tarball made on a Mac
      - name: Restore the state assessments from R2 (state/attains.tar.gz, the weekly ATTAINS job's output; read only)
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # after the build state, so this week's file replaces the copy that rides in build.tar.gz. Never stops the run:
          # absent, not fetched or unreadable, the export uses the copy in the build state, or shows no assessment
          # (pipeline/build/attains.py, docs/attains.md). Only the assessment file is written (unpack-attains --only cache)
          rc=0; python3 -I scripts/state_paths.py fetch state/attains.tar.gz attains.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack-attains attains.tar.gz --only cache \
              || echo "::warning::state/attains.tar.gz could not be read; the export uses the copy in the build state"
          elif [ "$rc" = 3 ]; then
            echo "no state assessments in R2 yet"
          else
            echo "::warning::state/attains.tar.gz could not be fetched; the export uses the copy in the build state"
          fi
          rm -f attains.tar.gz
      - name: Restore the raw caches from R2 (after the build state, which names the NY workbook entry)
        id: restore_raw
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # only the listed cache paths are written (scripts/state_paths.py unpack), whatever the tarball holds. Never
          # fails the run: without the caches it fetches what it needs. One that is there but could not be fetched is
          # not saved over (keep=1); one that could not be read is replaced by this run's.
          rc=0; python3 -I scripts/state_paths.py fetch state/raw-cache.tar.gz raw-cache.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack raw-cache.tar.gz \
              || echo "::warning::the raw cache could not be read; this run starts from the answers it fetches"
          elif [ "$rc" = 3 ]; then
            echo "no raw cache yet"
          else
            echo "keep=1" >> "$GITHUB_OUTPUT"
            echo "::warning::the raw cache could not be fetched; this run starts from the answers it fetches and keeps the stored one"
          fi
      - name: openboatlaunch's water records and outlines (its API, else the last good copy in R2)
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
        run: |
          # into ../openboatlaunch/out (water/<slug>.json and meta.json only: scripts/state_paths.py unpack-obl rules).
          # fetch-obl pulls the API's national bulk file (sha256 checked) at most once a day and only for a new
          # snapshot; otherwise, or on any failure (said in the log), the R2 copy is restored as before. Never stops
          # the refresh: without either it runs with no outlines here. After the raw caches, whose data/raw/obl-api
          # holds the cached meta and its ETag (a 304 most hours).
          rc=0; python3 -I scripts/state_paths.py fetch-obl || rc=$?
          if [ "$rc" != 0 ]; then
            rc=0; python3 -I scripts/state_paths.py fetch state/obl-water.tar.gz obl-water.tar.gz || rc=$?
            if [ "$rc" = 0 ]; then
              python3 -I scripts/state_paths.py unpack-obl obl-water.tar.gz \
                || echo "::warning::state/obl-water.tar.gz could not be read; this run goes on without openboatlaunch's outlines"
            elif [ "$rc" = 3 ]; then
              echo "::warning::state/obl-water.tar.gz is not in R2 yet; this run goes on without openboatlaunch's outlines"
            else
              echo "::warning::state/obl-water.tar.gz could not be fetched; this run goes on without openboatlaunch's outlines"
            fi
          fi
          rm -f obl-water.tar.gz
      - name: Backfill (one-time history loads named in the dispatch input, before the refresh)
        if: steps.pause.outputs.paused != '1' && github.event_name == 'workflow_dispatch' && github.event.inputs.backfill != ''
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
        run: |
          # each module reads its full history once (--backfill); the refresh that follows dedupes and the state save keeps it.
          # The rule for a backfill's exit code (2026-11-17, after refresh 43995607963): a module exits 0 when it read its
          # list and saved what it could read, naming the documents it could not read in its meta and its output line
          # (the feed stays unhealthy until they read); it exits non-zero only when the read itself failed (no list, nothing
          # read, a changed layout), and that fails this step. A module must accept --backfill (an unknown flag fails here).
          # the module's output reaches the public log through scripts/log_redact.py (addresses as scheme, host and
          # path; no key, token or account id; security review 2026-11-17 #7); pipefail keeps the module's exit code
          set -o pipefail
          rc=0
          for m in $BACKFILL; do
            case "$m" in *[!a-z0-9_]*) echo "::error::bad module name: $m"; exit 1 ;; esac
            [ -f "pipeline/ingest/$m.py" ] || { echo "::error::no such ingest module: $m"; exit 1; }
            echo "== backfill ingest.$m"
            (cd pipeline && .venv/bin/python -m "ingest.$m" --backfill) 2>&1 | python3 -I scripts/log_redact.py \
              || { echo "::error::ingest.$m --backfill failed"; rc=1; }
          done
          exit $rc
      - name: Refresh (feeds, status, reaches, charts, export, tally, R2 current/)
        id: refresh
        if: steps.pause.outputs.paused != '1'
        # a refresh that stopped at once (data/build/PAUSE, or another run's lock) says skipped=1: nothing after it is
        # published or saved (SOL wave1 P2-9). Its output reaches the public log through scripts/log_redact.py
        # (addresses as scheme, host and path; no key, token or account id; security review 2026-11-17 #7); pipefail
        # keeps the refresh's own exit code (the filter always exits 0)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
        run: |
          set -o pipefail
          sh scripts/refresh-data.sh 2>&1 | python3 -I scripts/log_redact.py
      - name: Full export to R2 for the site build (state/out.tar.gz; the site repository's publish workflow reads it)
        if: success() && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; out/ not published"; exit 0; }
          [ -d out ] || { echo "::error::no out/ folder: nothing to publish, and no state is saved"; exit 1; }
          # each its own command, so a failed archive or upload fails the step (SOL wave1 P2-12)
          tar -czf out.tar.gz out
          wrangler r2 object put dirtywaterwatch-data/state/out.tar.gz --file out.tar.gz --remote
          ls -la out.tar.gz
      - name: Save openboatlaunch's folder to R2 when the API changed it (state/obl-water.tar.gz, the fallback copy)
        # before the build state: when the upload fails, data/build/obl-changes.json goes back to before this run
        # (obl-not-saved), so the next run, restoring the older copy, asks for the same changes again
        if: success() && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rc=0; python3 -I scripts/state_paths.py pack-obl obl-water.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            wrangler r2 object put dirtywaterwatch-data/state/obl-water.tar.gz --file obl-water.tar.gz --remote \
              || python3 -I scripts/state_paths.py obl-not-saved
          elif [ "$rc" != 3 ]; then
            # the pack itself failed (not "nothing to save"): the folder is not saved either, so roll back the same way
            python3 -I scripts/state_paths.py obl-not-saved
          fi
          rm -f obl-water.tar.gz
      - name: History guard (records per source against the restored state, before the save)
        # a source whose records fell by at least 1 per cent and at least 5 records, or whose events file is gone, is
        # a warning with its counts and data/build/history-guard.json, and the restored archive is held in R2 at
        # state/held/build-<date>-<run>.tar.gz; the save goes on either way (scripts/state_paths.py guard)
        if: success() && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        continue-on-error: true
        run: |
          python3 -I scripts/state_paths.py guard restored-counts.json --restored restored-build.tar.gz \
            || echo "::warning::the history guard did not run to its end; the state is saved as usual"
      - name: Save pipeline state to R2
        # only after a refresh that ran to the end: a cancelled or failed run must not overwrite the saved history
        # (a seed from the owner's machine, or the last good run) with a partial one; nor a paused or skipped one
        if: success() && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # the daily and monthly copies this save is due for, written as pending into data/build before the archive
          # is made (data/build/state-generations.json travels with the state); made by the next step
          python3 -I scripts/state_paths.py generations plan \
            || echo "::warning::the state generations could not be planned; none is made this run"
          tar -czf build.tar.gz data/build
          # over 200 MB a warning (the history is still saved); over wrangler's 300 MiB upload limit, an error
          python3 -I scripts/state_paths.py check-size build.tar.gz --hard-mb 314
          wrangler r2 object put dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote
      - name: State generations (the day's first save to the daily ring, the month's to its monthly copy)
        # state/daily/build-<weekday>.tar.gz (seven keys, overwritten weekly) and state/monthly/build-<YYYY-MM>.tar.gz
        # (kept), the archive just saved; the record names a copy only after its upload, and the state is saved once
        # more so the record travels. A failed upload or second save is a warning and the next run tries again; never
        # fails the run
        if: success() && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        continue-on-error: true
        run: |
          rc=0; python3 -I scripts/state_paths.py generations put build.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            if tar -czf build.tar.gz data/build && python3 -I scripts/state_paths.py check-size build.tar.gz --hard-mb 314 \
                && wrangler r2 object put dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote; then
              echo "state saved again with its generation record"
            else
              echo "::warning::the state could not be saved again with its generation record; the next run makes the copies again"
            fi
          elif [ "$rc" != 3 ]; then
            echo "::warning::the state generations were not made this run (exit $rc); the next run tries again"
          fi
      - name: Save the raw caches to R2 (state/raw-cache.tar.gz; the same rule)
        # the cached answers only (scripts/state_paths.py); the next run's waters-nhd target and NLDI's hourly quota
        # resume from them. Over the cap the save fails with the sizes printed and the build state above still stands;
        # continue-on-error keeps the dataset release going while that is looked at.
        if: success() && steps.restore_raw.outcome == 'success' && steps.restore_raw.outputs.keep != '1' && steps.refresh.outputs.skipped != '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          python3 -I scripts/state_paths.py pack raw-cache.tar.gz
          wrangler r2 object put dirtywaterwatch-data/state/raw-cache.tar.gz --file raw-cache.tar.gz --remote
      - name: Dataset release (daily "latest"; dated on Sundays)
        # a release failure (GitHub's API answered 500 on an asset upload on 2026-11-04) never fails the run: the
        # export, the live files and the state are already saved; the upload is retried three times
        if: success() && steps.release.outputs.due == '1' && steps.pause.outputs.paused != '1' && steps.refresh.outputs.skipped != '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          WEEKLY: ${{ steps.release.outputs.weekly }}
          AWS_ACCESS_KEY_ID: ''       # no storage keys here (scripts/r2-s3-keys.sh put them in the job's environment)
          AWS_SECRET_ACCESS_KEY: ''
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; no release"; exit 0; }
          (cd out && zip -qr ../dataset.zip . -x 'csv/*')
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest dataset" --notes "Rolling dataset; replaced daily. See DATA-LICENSE.md."
          n=0; until gh release upload latest dataset.zip --clobber; do n=$((n + 1)); [ "$n" -ge 3 ] && { echo "::warning::dataset release upload failed three times; the export and state are saved"; exit 1; }; sleep $((15 * n)); done
          if [ "$WEEKLY" = "1" ]; then
            tag="dataset-$(date -u +%F)"; gh release create "$tag" dataset.zip --title "Dataset $(date -u +%F)" --notes "Weekly dataset snapshot. See DATA-LICENSE.md." || true
          fi
