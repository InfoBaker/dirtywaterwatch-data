name: Refresh data
# Hourly (off the hour: GitHub delays runs queued at :00): pull every feed, compute statuses and reaches, build
# charts, export, push the live files to R2 current/ for the site, save the pipeline state, and once a day attach
# the full dataset to the rolling "latest" release (a dated release on Sundays). Standard hosted runners are free
# on a public repository. The ingesters keep state between runs (history and snapshot files in data/build), so
# that folder is restored from R2 state/build.tar.gz at the start and saved back at the end. Raw fetches stay on
# the runner (they can carry personal fields and are never committed).
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (R2 edit) and, for the model steps,
# OPENROUTER_API_KEY (without it they run rules-only).
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Ingest modules to run once with --backfill before the refresh, space-separated (e.g. nc_dwr_sso nc_algal_blooms fl_dep_pnp); their history then lives in the saved state"
        required: false
        default: ''
  schedule:
    - cron: '7 * * * *'   # hourly, off the hour (enabled 2026-11-04 after run 3 restored the seeded state and uploaded)

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # to publish the dataset release; the workflow commits nothing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Secrets present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - run: npm install -g wrangler@4
      - name: Restore pipeline state from R2
        run: |
          wrangler r2 object get dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote && tar -xzf build.tar.gz || echo "no state yet"
          find data/build -name '._*' -delete 2>/dev/null || true   # AppleDouble files from a tarball made on a Mac
      - name: Backfill (one-time history loads named in the dispatch input, before the refresh)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill != ''
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          # each module reads its full history once (--backfill); the refresh that follows dedupes and the state save keeps it
          rc=0
          for m in $BACKFILL; do
            case "$m" in *[!a-z0-9_]*) echo "::error::bad module name: $m"; exit 1 ;; esac
            [ -f "pipeline/ingest/$m.py" ] || { echo "::error::no such ingest module: $m"; exit 1; }
            echo "== backfill ingest.$m"
            (cd pipeline && .venv/bin/python -m "ingest.$m" --backfill) || { echo "::error::ingest.$m --backfill failed"; rc=1; }
          done
          exit $rc
      - name: Refresh (feeds, status, reaches, charts, export, tally, R2 current/)
        run: sh scripts/refresh-data.sh
      - name: Full export to R2 for the site build (state/out.tar.gz; the site repository's publish workflow reads it)
        if: success()
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; out/ not published"; exit 0; }
          tar -czf out.tar.gz out && wrangler r2 object put dirtywaterwatch-data/state/out.tar.gz --file out.tar.gz --remote
          ls -la out.tar.gz
      - name: Save pipeline state to R2
        # only after a refresh that ran to the end: a cancelled or failed run must not overwrite the saved history
        # (a seed from the owner's machine, or the last good run) with a partial one
        if: success()
        run: |
          tar -czf build.tar.gz data/build && wrangler r2 object put dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote
      - name: Dataset release (daily "latest"; dated on Sundays)
        if: github.event_name == 'workflow_dispatch' || (github.event.schedule && startsWith(github.run_started_at, 'T03'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; no release"; exit 0; }
          (cd out && zip -qr ../dataset.zip . -x 'csv/*')
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest dataset" --notes "Rolling dataset; replaced daily. See DATA-LICENSE.md."
          gh release upload latest dataset.zip --clobber
          if [ "$(date -u +%u)" = "7" ]; then
            tag="dataset-$(date -u +%F)"; gh release create "$tag" dataset.zip --title "Dataset $(date -u +%F)" --notes "Weekly dataset snapshot. See DATA-LICENSE.md." || true
          fi
