name: Refresh data
# Hourly (off the hour: GitHub delays runs queued at :00): pull every feed, compute statuses and reaches, build
# charts, export, push the live files to R2 current/ for the site, save the pipeline state, and once a day attach
# the full dataset to the rolling "latest" release (a dated release on Sundays). Standard hosted runners are free
# on a public repository. The ingesters keep state between runs (history and snapshot files in data/build), so
# that folder is restored from R2 state/build.tar.gz at the start and saved back at the end. The answers the code
# reads back from data/raw (NHD, NLDI and Overpass answers, the Census outlines, IEM rainfall, the RI layers, the DC
# boundary, the NY workbook, this month's NJ ECHO answers: scripts/state_paths.py lists them with the reasons) are
# state/raw-cache.tar.gz, restored after it and saved with it. Every other raw fetch stays on the runner (bulk raw
# saves can carry personal fields and are never saved or committed). openboatlaunch's water records and outlines
# come from its API (scripts/state_paths.py fetch-obl: the national bulk file, at most once a day, key OBL_API_KEY)
# into ../openboatlaunch/out, where the pipeline reads them (build/status.py), else from the last good copy in R2
# (state/obl-water.tar.gz); the hourly changes check (make obl-sync, the refresh's first stage) brings the folder up
# to date, and the folder is saved back to R2 when the API changed it. Without either the run goes on without the
# outlines (a warning). Each state object is capped at 200 MB
# (the raw caches are not saved over it; the build state warns over it and is still saved up to wrangler's limit).
# Needs the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets (R2 edit), for the model steps
# OPENROUTER_API_KEY (without it they run rules-only), and for openboatlaunch's API OBL_API_KEY (without it, or with
# the API down, the R2 copy is used as before).
on:
  workflow_dispatch:
    inputs:
      backfill:
        description: "Ingest modules to run once with --backfill before the refresh, space-separated (e.g. nc_dwr_sso nc_algal_blooms fl_dep_pnp); their history then lives in the saved state"
        required: false
        default: ''
  schedule:
    - cron: '7 * * * *'   # hourly, off the hour (enabled 2026-11-04 after run 3 restored the seeded state and uploaded)

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write   # to publish the dataset release; the workflow commits nothing

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 100   # a one-time backfill plus the refresh ran past 55 minutes on 2026-11-04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Secrets present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # requirements.txt carries shapely, which also places South Dakota's EPA overflow reports in the Mountain or Central
      # zone by their points (data/reference/sd-mountain-time-counties.json, committed; nothing to fetch here)
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - run: npm install -g wrangler@4
      - name: System tools (pdftotext, for MWRD's table of reversals to Lake Michigan)
        # ingest/il_mwrd_lake_reversals.py reads the PDF with poppler's pdftotext; without it that feed writes ok=False
        # and keeps its previous records, so a failed install warns and never stops the run
        run: |
          command -v pdftotext >/dev/null || sudo apt-get install -y -qq poppler-utils >/dev/null \
            || echo "::warning::poppler-utils could not be installed; MWRD's reversals table is not read this run"
      - name: Restore pipeline state from R2
        run: |
          # a missing object is a first run; one that is there but cannot be fetched or unpacked stops the run here, so
          # nothing is published without the history and the blocklist and the stored state is never saved over
          rc=0; python3 -I scripts/state_paths.py fetch state/build.tar.gz build.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            tar -xzf build.tar.gz || { echo "::error::state/build.tar.gz could not be unpacked; nothing is published or saved this run"; exit 1; }
          elif [ "$rc" = 3 ]; then
            echo "no state yet"
          else
            echo "::error::state/build.tar.gz is in R2 but could not be fetched; nothing is published or saved this run"; exit 1
          fi
          find data/build -name '._*' -delete 2>/dev/null || true   # AppleDouble files from a tarball made on a Mac
      - name: Restore the raw caches from R2 (after the build state, which names the NY workbook entry)
        id: restore_raw
        run: |
          # only the listed cache paths are written (scripts/state_paths.py unpack), whatever the tarball holds. Never
          # fails the run: without the caches it fetches what it needs. One that is there but could not be fetched is
          # not saved over (keep=1); one that could not be read is replaced by this run's.
          rc=0; python3 -I scripts/state_paths.py fetch state/raw-cache.tar.gz raw-cache.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack raw-cache.tar.gz \
              || echo "::warning::the raw cache could not be read; this run starts from the answers it fetches"
          elif [ "$rc" = 3 ]; then
            echo "no raw cache yet"
          else
            echo "keep=1" >> "$GITHUB_OUTPUT"
            echo "::warning::the raw cache could not be fetched; this run starts from the answers it fetches and keeps the stored one"
          fi
      - name: openboatlaunch's water records and outlines (its API, else the last good copy in R2)
        run: |
          # into ../openboatlaunch/out (water/<slug>.json and meta.json only: scripts/state_paths.py unpack-obl rules).
          # fetch-obl pulls the API's national bulk file (sha256 checked) at most once a day and only for a new
          # snapshot; otherwise, or on any failure (said in the log), the R2 copy is restored as before. Never stops
          # the refresh: without either it runs with no outlines here. After the raw caches, whose data/raw/obl-api
          # holds the cached meta and its ETag (a 304 most hours).
          rc=0; python3 -I scripts/state_paths.py fetch-obl || rc=$?
          if [ "$rc" != 0 ]; then
            rc=0; python3 -I scripts/state_paths.py fetch state/obl-water.tar.gz obl-water.tar.gz || rc=$?
            if [ "$rc" = 0 ]; then
              python3 -I scripts/state_paths.py unpack-obl obl-water.tar.gz \
                || echo "::warning::state/obl-water.tar.gz could not be read; this run goes on without openboatlaunch's outlines"
            elif [ "$rc" = 3 ]; then
              echo "::warning::state/obl-water.tar.gz is not in R2 yet; this run goes on without openboatlaunch's outlines"
            else
              echo "::warning::state/obl-water.tar.gz could not be fetched; this run goes on without openboatlaunch's outlines"
            fi
          fi
          rm -f obl-water.tar.gz
      - name: Backfill (one-time history loads named in the dispatch input, before the refresh)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.backfill != ''
        env:
          BACKFILL: ${{ github.event.inputs.backfill }}
        run: |
          # each module reads its full history once (--backfill); the refresh that follows dedupes and the state save keeps it
          rc=0
          for m in $BACKFILL; do
            case "$m" in *[!a-z0-9_]*) echo "::error::bad module name: $m"; exit 1 ;; esac
            [ -f "pipeline/ingest/$m.py" ] || { echo "::error::no such ingest module: $m"; exit 1; }
            echo "== backfill ingest.$m"
            (cd pipeline && .venv/bin/python -m "ingest.$m" --backfill) || { echo "::error::ingest.$m --backfill failed"; rc=1; }
          done
          exit $rc
      - name: Refresh (feeds, status, reaches, charts, export, tally, R2 current/)
        run: sh scripts/refresh-data.sh
      - name: Full export to R2 for the site build (state/out.tar.gz; the site repository's publish workflow reads it)
        if: success()
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; out/ not published"; exit 0; }
          tar -czf out.tar.gz out && wrangler r2 object put dirtywaterwatch-data/state/out.tar.gz --file out.tar.gz --remote
          ls -la out.tar.gz
      - name: Save openboatlaunch's folder to R2 when the API changed it (state/obl-water.tar.gz, the fallback copy)
        # before the build state: when the upload fails, data/build/obl-changes.json goes back to before this run
        # (obl-not-saved), so the next run, restoring the older copy, asks for the same changes again
        if: success()
        run: |
          rc=0; python3 -I scripts/state_paths.py pack-obl obl-water.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            wrangler r2 object put dirtywaterwatch-data/state/obl-water.tar.gz --file obl-water.tar.gz --remote \
              || python3 -I scripts/state_paths.py obl-not-saved
          elif [ "$rc" != 3 ]; then
            # the pack itself failed (not "nothing to save"): the folder is not saved either, so roll back the same way
            python3 -I scripts/state_paths.py obl-not-saved
          fi
          rm -f obl-water.tar.gz
      - name: Save pipeline state to R2
        # only after a refresh that ran to the end: a cancelled or failed run must not overwrite the saved history
        # (a seed from the owner's machine, or the last good run) with a partial one
        if: success()
        run: |
          tar -czf build.tar.gz data/build
          # over 200 MB a warning (the history is still saved); over wrangler's 300 MiB upload limit, an error
          python3 -I scripts/state_paths.py check-size build.tar.gz --hard-mb 314
          wrangler r2 object put dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote
      - name: Save the raw caches to R2 (state/raw-cache.tar.gz; the same rule)
        # the cached answers only (scripts/state_paths.py); the next run's waters-nhd target and NLDI's hourly quota
        # resume from them. Over the cap the save fails with the sizes printed and the build state above still stands;
        # continue-on-error keeps the dataset release going while that is looked at.
        if: success() && steps.restore_raw.outcome == 'success' && steps.restore_raw.outputs.keep != '1'
        continue-on-error: true
        run: |
          python3 -I scripts/state_paths.py pack raw-cache.tar.gz
          wrangler r2 object put dirtywaterwatch-data/state/raw-cache.tar.gz --file raw-cache.tar.gz --remote
      - name: Dataset release (daily "latest"; dated on Sundays)
        # a release failure (GitHub's API answered 500 on an asset upload on 2026-11-04) never fails the run: the
        # export, the live files and the state are already saved; the upload is retried three times
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.run_started_at, 'T03:'))
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f data/build/export-blocked.json ] && { echo "export blocked; no release"; exit 0; }
          (cd out && zip -qr ../dataset.zip . -x 'csv/*')
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Latest dataset" --notes "Rolling dataset; replaced daily. See DATA-LICENSE.md."
          n=0; until gh release upload latest dataset.zip --clobber; do n=$((n + 1)); [ "$n" -ge 3 ] && { echo "::warning::dataset release upload failed three times; the export and state are saved"; exit 1; }; sleep $((15 * n)); done
          if [ "$(date -u +%u)" = "7" ]; then
            tag="dataset-$(date -u +%F)"; gh release create "$tag" dataset.zip --title "Dataset $(date -u +%F)" --notes "Weekly dataset snapshot. See DATA-LICENSE.md." || true
          fi
