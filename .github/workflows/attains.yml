name: State assessments (ATTAINS)
# Weekly: the states' own Clean Water Act assessments joined to the water records (pipeline/build/attains.py,
# docs/attains.md), shown on a water's page beside its status and never changing it. Keyless: EPA's Expert Query
# national downloads (their addresses read from EPA's file list each run) and the ATTAINS map layers; no ATTAINS key is
# passed. The water records are in git; their outlines are openboatlaunch's, restored read only from R2
# state/obl-water.tar.gz (the copy the hourly refresh keeps), else from openboatlaunch's API. The assessment-unit
# geometry is cached per state in R2 state/attains-geom.tar.gz and fetched again only for a state EPA reloaded (one
# request at a time, with a pause). The result, data/build/attains/attains-waters.json, is saved to R2
# state/attains.tar.gz, which the hourly refresh restores read only after its build state, so the export reads it.
# A file at R2 state/PAUSE pauses it like the refresh: nothing is fetched or saved.
# Its own concurrency group: it writes only its own two R2 objects (never state/build.tar.gz, never current/), so it
# never waits on, blocks or cancels an hourly refresh or a state batch, which share the refresh's one waiting place.
# The secrets are given to the steps that use them, never to the job (security review 2026-11-17 #12): CLOUDFLARE_R2_TOKEN
# and CLOUDFLARE_ACCOUNT_ID to the steps that reach R2 (objects in dirtywaterwatch-data through R2's S3 endpoint,
# scripts/r2-s3-keys.sh), OBL_API_KEY to the outlines step (used only when the R2 copy is missing). The build step needs
# no storage and runs without the storage keys; its output reaches the public log through scripts/log_redact.py.
# Actions are pinned to a full commit (the version in the comment), wrangler and the Python packages to exact versions.
on:
  workflow_dispatch:
    inputs:
      refresh_geometry:
        description: "Fetch every state's assessment-unit geometry again (yes or no)"
        required: false
        default: 'no'
  schedule:
    - cron: '23 6 * * 1'   # Mondays, outside the refresh's minute

concurrency:
  group: attains
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  attains:
    runs-on: ubuntu-latest
    timeout-minutes: 150   # a full geometry fetch (about 440 requests) and the national files' read
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Secrets present
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with: { persist-credentials: false }   # nothing here pushes
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020   # v4.4.0
        with: { node-version: 22 }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - run: npm install -g wrangler@4.158.0 && sh scripts/wrangler-guard.sh   # every later wrangler call is filtered (no account name in the log)
      - run: sh scripts/r2-s3-keys.sh   # R2 objects through R2's S3 endpoint: the token is limited to the pipeline's buckets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Pause switch (R2 state/PAUSE, shared with the refresh)
        id: pause
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          rc=0; python3 -I scripts/state_paths.py fetch state/PAUSE pause.check || rc=$?
          rm -f pause.check
          case "$rc" in
            0) echo "paused=1" >> "$GITHUB_OUTPUT"
               echo "::notice::R2 state/PAUSE is set: nothing is fetched or saved this run" ;;
            3) echo "R2 state/PAUSE is not set" ;;
            *) echo "::error::R2 state/PAUSE could not be checked; nothing is fetched or saved this run"; exit 1 ;;
          esac
      - name: openboatlaunch's water records and outlines (the R2 copy, else its API)
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
        run: |
          # into ../openboatlaunch/out, read only (scripts/state_paths.py unpack-obl rules); without outlines there is
          # nothing to join, so the run stops and saves nothing
          rc=0; python3 -I scripts/state_paths.py fetch state/obl-water.tar.gz obl-water.tar.gz || rc=$?
          if [ "$rc" = 0 ] && python3 -I scripts/state_paths.py unpack-obl obl-water.tar.gz; then
            echo "outlines restored from R2"
          else
            echo "the R2 copy was not restored; trying openboatlaunch's API"
            python3 -I scripts/state_paths.py fetch-obl --state-file obl-changes.json \
              || { echo "::error::no openboatlaunch outlines: nothing to join, nothing saved"; exit 1; }
          fi
          rm -f obl-water.tar.gz obl-changes.json
      - name: Restore the assessment-unit geometry (R2 state/attains-geom.tar.gz)
        id: restore_geom
        if: steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # absent: a first run (every state is fetched); there but not fetched: this run fetches what it needs and the
          # stored object is kept (keep=1); there but unreadable: replaced by this run's
          rc=0; python3 -I scripts/state_paths.py fetch state/attains-geom.tar.gz attains-geom.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack-attains attains-geom.tar.gz --only geom \
              || echo "::warning::the geometry cache could not be read; every state is fetched again"
          elif [ "$rc" = 3 ]; then
            echo "no geometry cache yet: every state is fetched"
          else
            echo "keep=1" >> "$GITHUB_OUTPUT"
            echo "::warning::the geometry cache could not be fetched; this run fetches every state and keeps the stored one"
          fi
          rm -f attains-geom.tar.gz
      - name: Build the state assessments (keyless)
        if: steps.pause.outputs.paused != '1'
        # its output reaches the public log through scripts/log_redact.py (addresses as scheme, host and path; no key,
        # token or account id); pipefail keeps the build's own exit code
        env:
          REFRESH_GEOMETRY: ${{ github.event.inputs.refresh_geometry }}
          AWS_ACCESS_KEY_ID: ''       # no storage keys here (scripts/r2-s3-keys.sh put them in the job's environment)
          AWS_SECRET_ACCESS_KEY: ''
        run: |
          set -o pipefail
          set -- --out data/build/attains/attains-waters.json
          if [ "$REFRESH_GEOMETRY" = yes ]; then set -- "$@" --refresh-geometry; fi
          pipeline/.venv/bin/python -I scripts/attains_context.py "$@" 2>&1 | python3 -I scripts/log_redact.py
      - name: Save the assessments to R2 (state/attains.tar.gz; the hourly refresh restores it)
        if: success() && steps.pause.outputs.paused != '1'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -s data/build/attains/attains-waters.json ] || { echo "::error::no assessment file was written"; exit 1; }
          tar -czf attains.tar.gz data/build/attains/attains-waters.json
          python3 -I scripts/state_paths.py check-size attains.tar.gz
          wrangler r2 object put dirtywaterwatch-data/state/attains.tar.gz --file attains.tar.gz --remote
      - name: Save the geometry cache to R2 (state/attains-geom.tar.gz)
        # after a good run only, and not over a stored object this run could not fetch (it may hold states this run
        # did not need); a failure here is a warning: next week fetches again
        if: success() && steps.pause.outputs.paused != '1' && steps.restore_geom.outputs.keep != '1'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_R2_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          tar -czf attains-geom.tar.gz data/raw/attains/geom
          # about 200 MB for every live state (2026-11-21): over the 200 MB default, inside wrangler's upload limit
          python3 -I scripts/state_paths.py check-size attains-geom.tar.gz --max-mb 300
          wrangler r2 object put dirtywaterwatch-data/state/attains-geom.tar.gz --file attains-geom.tar.gz --remote
