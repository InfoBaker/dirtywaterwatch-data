name: Georgia history backfill (one-off)
# Runs the Georgia EPD spills backfill once, by hand, against the saved pipeline state: restores R2
# state/build.tar.gz, downloads every dated posting EPD still serves that is not saved yet (about one request a
# second; data/build/archive/ga-epd-spills/), rebuilds the Georgia records from all of them oldest first (one record
# per spill with the daily feed; EPA's Georgia reports paired again), and saves the state back. The hourly refresh
# then exports as usual. Never scheduled. It shares the refresh concurrency group, so it never runs alongside an
# hourly run (each would save its own state).
on:
  workflow_dispatch:
    inputs:
      from:
        description: "First posting date to request (YYYY-MM-DD); empty: 400 days before the linked posting"
        required: false
        default: ""

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - run: npm install -g wrangler@4
      - name: Restore pipeline state from R2 (required)
        run: |
          wrangler r2 object get dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote
          tar -xzf build.tar.gz
          find data/build -name '._*' -delete 2>/dev/null || true
          test -f data/build/events/ga-epd-spills.json || echo "no Georgia events file yet: the backfill starts it"
      - name: Backfill
        working-directory: pipeline
        env:
          FROM: ${{ github.event.inputs.from }}
        run: |
          if [ -n "$FROM" ]; then .venv/bin/python -m ingest.ga_epd_spills --backfill "$FROM"; else .venv/bin/python -m ingest.ga_epd_spills --backfill; fi
          .venv/bin/python -c "import json; m = json.load(open('../data/build/events/ga-epd-spills.json'))['meta']; print(json.dumps(m['backfill'], indent=1)); print('errors', m.get('errors'), 'unreadable', m.get('unreadable_postings'))"
      - name: Save pipeline state to R2
        if: success()
        run: |
          tar -czf build.tar.gz data/build && wrangler r2 object put dirtywaterwatch-data/state/build.tar.gz --file build.tar.gz --remote
