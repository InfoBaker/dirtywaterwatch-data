name: State water batch
# The per-state batch of docs/national-approach.md §4.3 (site repository): a state's receiving-water records from NHD
# and its outfalls tied to them, run on demand, never inside the hourly refresh. Dispatch only:
#   gh workflow run state-build.yml -f state=NC -f steps="waters ties" -f budget_s=1500 -f max_requests=1000
# The steps are scripts/state_batch.py's (its docstring says what each runs): obl-check, registry, waters, ties.
# `reaches` is not offered: build/reaches.py has no state scope yet. `registry` needs EPA's CSO inventory and an
# openboatlaunch snapshot, which this runner does not have, so it is refused here with that reason.
# It takes the refresh's concurrency group, so it never runs beside a refresh: it waits for a running one, and the
# hourly refresh waits for it (a dispatch still waiting when the next scheduled refresh queues is replaced by it:
# dispatch again). The pipeline state (state/build.tar.gz) and the raw caches (state/raw-cache.tar.gz) are restored
# from R2; the raw caches are saved back unless the run was cancelled (they are answers, and they are what makes the
# next dispatch resume where this one stopped); the build state is never saved from here. The workflow commits nothing
# to main: the changed registry files go on a branch batch/<st>-<date> with a pull request listing the counts, for a
# person to review (the same branch and pull request are updated by a second run that day). The privacy scan runs
# over those files and the text first. The repository must allow GitHub Actions to create pull requests (Settings,
# Actions, General, Workflow permissions); otherwise the branch is pushed and the run says so.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Two-letter state code (e.g. NC)"
        required: true
        type: string
      steps:
        description: "Steps, space-separated, from: obl-check registry waters ties (run in that order)"
        required: false
        default: 'waters ties'
        type: string
      budget_s:
        description: "Seconds the NHD pass may spend before it stops starting requests (60 to 3600; its OSM, other-places and high-resolution budgets come on top)"
        required: false
        default: '1500'
        type: string
      max_requests:
        description: "Network requests the NHD pass may make (cached answers are free; 1 to 20000)"
        required: false
        default: '1000'
        type: string

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write        # to push the batch branch
  pull-requests: write   # to open or update its pull request

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONUNBUFFERED: '1'
      # the inputs reach the shell as variables only, never pasted into a script; state_batch.py validates them
      STATE: ${{ inputs.state }}
      STEPS: ${{ inputs.steps }}
      BUDGET_S: ${{ inputs.budget_s }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
      OUT: data/build/batch/out
    steps:
      - name: Secrets present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - name: Check the inputs (and print the commands the steps will run)
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py plan --state "$STATE" --steps "$STEPS" \
            --budget-s "$BUDGET_S" --max-requests "$MAX_REQUESTS"
          echo "BATCH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: npm install -g wrangler@4
      - name: Restore pipeline state from R2 (read only here)
        run: |
          # the name blocklist the publish needs comes with it; an object that is there but cannot be read stops the batch
          rc=0; python3 -I scripts/state_paths.py fetch state/build.tar.gz build.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            tar -xzf build.tar.gz || { echo "::error::state/build.tar.gz could not be unpacked"; exit 1; }
          elif [ "$rc" = 3 ]; then
            echo "no state yet"
          else
            echo "::error::state/build.tar.gz is in R2 but could not be fetched"; exit 1
          fi
          find data/build -name '._*' -delete 2>/dev/null || true
      - name: Restore the raw caches from R2
        id: restore_raw
        run: |
          rc=0; python3 -I scripts/state_paths.py fetch state/raw-cache.tar.gz raw-cache.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack raw-cache.tar.gz \
              || echo "::warning::the raw cache could not be read; this run starts from the answers it fetches"
          elif [ "$rc" = 3 ]; then
            echo "no raw cache yet"
          else
            echo "keep=1" >> "$GITHUB_OUTPUT"
            echo "::warning::the raw cache could not be fetched; this run starts from the answers it fetches and keeps the stored one"
          fi
      - name: Run the steps
        id: batch
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py run --state "$STATE" --steps "$STEPS" \
            --budget-s "$BUDGET_S" --max-requests "$MAX_REQUESTS" --out "$OUT"
      - name: Save the raw caches to R2 (unless cancelled; the next dispatch resumes from them)
        # only after the restore ran: a run that never restored them, or could not fetch them, never saves over them
        if: ${{ !cancelled() && steps.restore_raw.outcome == 'success' && steps.restore_raw.outputs.keep != '1' }}
        run: |
          python3 -I scripts/state_paths.py pack raw-cache.tar.gz
          wrangler r2 object put dirtywaterwatch-data/state/raw-cache.tar.gz --file raw-cache.tar.gz --remote
      - name: Keep the summary and the step logs (14 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: state-batch-${{ github.run_id }}
          path: |
            data/build/batch/out/
            data/build/outfall-waters-*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Branch and pull request (the changed registry files, for a person to review)
        if: ${{ !cancelled() && steps.batch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py publish --state "$STATE" --body "$OUT/pr-body.md" \
            --date "$BATCH_DATE"
