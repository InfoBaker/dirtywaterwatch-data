name: State water batch
# The per-state batch of docs/national-approach.md §4.3 (site repository): a state's receiving-water records from NHD
# and its outfalls tied to them, run on demand, never inside the hourly refresh. Dispatch only:
#   gh workflow run state-build.yml -f state=NC -f steps="waters ties" -f budget_s=1500 -f max_requests=1000
#   gh workflow run state-build.yml -f state=MI -f steps="extract obl-check waters ties"
#   gh workflow run state-build.yml -f state=FL -f steps="osm ties" -f osm_budget=1200
# The steps are scripts/state_batch.py's (its docstring says what each runs): extract, obl-check, registry, waters,
# osm, ties. openboatlaunch's water records and outlines come from its API (scripts/state_paths.py fetch-obl, the
# national bulk file, at most once a day; key OBL_API_KEY) or else from R2 state/obl-water.tar.gz (the last good copy
# the hourly refresh saves), into ../openboatlaunch/out, where the pipeline reads them; with the key, `extract` reads
# the state's list from the API (states/{ST}/waters) and the folder is its fallback. The batch never saves the folder:
# `extract` writes the state's data/waters-<st>.json from them,
# and `waters`, `osm` and `ties` measure against their outlines (OBL_WATER_DIR). Not in R2: a warning (extract then
# refuses and ties without an outline are held, as before); there but not fetched or not readable: the batch stops.
# `osm` is the waters step with OpenStreetMap's pass given osm_budget seconds (up to 20 minutes; Overpass answers
# GitHub's runners), resumed by the next dispatch from the cached answers.
# `reaches` is not offered: build/reaches.py has no state scope yet. `registry` needs EPA's CSO inventory, which this
# runner does not have, so it is refused here with that reason.
# It takes the refresh's concurrency group, so it never runs beside a refresh: it waits for a running one, and the
# hourly refresh waits for it. GitHub keeps one waiting run per group and cancels the older waiting one when another
# queues, whichever workflow it belongs to: a batch still waiting when a refresh queues is replaced by it (dispatch
# again), and a refresh waiting behind a batch is replaced by a second batch dispatch, so the site's data waits for
# the next refresh. Dispatch one batch at a time, when no refresh is waiting (gh run list --workflow refresh.yml
# --status queued; --status pending), and keep the budget well inside the hour. The pipeline state (state/build.tar.gz) and the raw caches (state/raw-cache.tar.gz) are restored
# from R2; the raw caches are saved back unless the run was cancelled (they are answers, and they are what makes the
# next dispatch resume where this one stopped); the build state is never saved from here. The workflow commits nothing
# to main: the changed registry files go on a branch batch/<st>-<date> with a pull request listing the counts, for a
# person to review (the same branch and pull request are updated by a second run that day). The privacy scan runs
# over those files and the text first. The repository must allow GitHub Actions to create pull requests (Settings,
# Actions, General, Workflow permissions); otherwise the branch is pushed and the run says so.
on:
  workflow_dispatch:
    inputs:
      state:
        description: "Two-letter state code (e.g. NC)"
        required: true
        type: string
      steps:
        description: "Steps, space-separated, from: extract obl-check registry waters osm names ties (run in that order)"
        required: false
        default: 'waters ties'
        type: string
      budget_s:
        description: "Seconds the NHD pass may spend before it stops starting requests (60 to 3600; its OSM, other-places and high-resolution budgets come on top)"
        required: false
        default: '1500'
        type: string
      max_requests:
        description: "Network requests the NHD pass may make (cached answers are free; 1 to 20000)"
        required: false
        default: '1000'
        type: string
      osm_budget:
        description: "Seconds the osm step's OpenStreetMap pass may spend on Overpass (60 to 1200; with budget_s at most 3780 together)"
        required: false
        default: '1200'
        type: string

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write        # to push the batch branch
  pull-requests: write   # to open or update its pull request

jobs:
  batch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      OBL_API_KEY: ${{ secrets.OBL_API_KEY }}
      PYTHONUNBUFFERED: '1'
      # the inputs reach the shell as variables only, never pasted into a script; state_batch.py validates them
      STATE: ${{ inputs.state }}
      STEPS: ${{ inputs.steps }}
      BUDGET_S: ${{ inputs.budget_s }}
      MAX_REQUESTS: ${{ inputs.max_requests }}
      OSM_BUDGET: ${{ inputs.osm_budget }}
      OUT: data/build/batch/out
    steps:
      - name: Secrets present
        run: |
          [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || {
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are needed"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip, cache-dependency-path: pipeline/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: python -m venv .venv && .venv/bin/pip install -q -r requirements.txt
        working-directory: pipeline
      - name: Check the inputs (and print the commands the steps will run)
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py plan --state "$STATE" --steps "$STEPS" \
            --budget-s "$BUDGET_S" --max-requests "$MAX_REQUESTS" --osm-budget "$OSM_BUDGET"
          echo "BATCH_DATE=$(date -u +%F)" >> "$GITHUB_ENV"
      - run: npm install -g wrangler@4
      - name: Restore pipeline state from R2 (read only here)
        run: |
          # the name blocklist the publish needs comes with it; an object that is there but cannot be read stops the batch
          rc=0; python3 -I scripts/state_paths.py fetch state/build.tar.gz build.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            tar -xzf build.tar.gz || { echo "::error::state/build.tar.gz could not be unpacked"; exit 1; }
          elif [ "$rc" = 3 ]; then
            echo "no state yet"
          else
            echo "::error::state/build.tar.gz is in R2 but could not be fetched"; exit 1
          fi
          find data/build -name '._*' -delete 2>/dev/null || true
      - name: openboatlaunch's water records and outlines (its API, else the last good copy in R2)
        run: |
          # into ../openboatlaunch/out (water/<slug>.json and meta.json only: scripts/state_paths.py unpack-obl rules),
          # where ingest.obl_waters and build/status.py's outlines read them. fetch-obl first (the API's national file,
          # sha256 checked; on any failure, said in the log, the R2 copy). Before the raw caches, so a batch stopped
          # here never saves them. R2 copy not there: a warning; there but not fetched or not readable: the batch
          # stops, since its ties would be measured without the outlines.
          rc=0; python3 -I scripts/state_paths.py fetch-obl || rc=$?
          if [ "$rc" != 0 ]; then
            rc=0; python3 -I scripts/state_paths.py fetch state/obl-water.tar.gz obl-water.tar.gz || rc=$?
            if [ "$rc" = 0 ]; then
              python3 -I scripts/state_paths.py unpack-obl obl-water.tar.gz \
                || { echo "::error::state/obl-water.tar.gz is in R2 but could not be read; the batch stops"; exit 1; }
            elif [ "$rc" = 3 ]; then
              echo "::warning::state/obl-water.tar.gz is not in R2 yet: no openboatlaunch records or outlines this run (extract refuses; a tie that needs an outline is held)"
            else
              echo "::error::state/obl-water.tar.gz is in R2 but could not be fetched; the batch stops"; exit 1
            fi
          fi
          rm -f obl-water.tar.gz
      - name: Restore the raw caches from R2
        id: restore_raw
        run: |
          rc=0; python3 -I scripts/state_paths.py fetch state/raw-cache.tar.gz raw-cache.tar.gz || rc=$?
          if [ "$rc" = 0 ]; then
            python3 -I scripts/state_paths.py unpack raw-cache.tar.gz \
              || echo "::warning::the raw cache could not be read; this run starts from the answers it fetches"
          elif [ "$rc" = 3 ]; then
            echo "no raw cache yet"
          else
            echo "keep=1" >> "$GITHUB_OUTPUT"
            echo "::warning::the raw cache could not be fetched; this run starts from the answers it fetches and keeps the stored one"
          fi
      - name: Run the steps
        id: batch
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py run --state "$STATE" --steps "$STEPS" \
            --budget-s "$BUDGET_S" --max-requests "$MAX_REQUESTS" --osm-budget "$OSM_BUDGET" --out "$OUT"
      - name: Save the raw caches to R2 (unless cancelled; the next dispatch resumes from them)
        # only after the restore ran: a run that never restored them, or could not fetch them, never saves over them
        if: ${{ !cancelled() && steps.restore_raw.outcome == 'success' && steps.restore_raw.outputs.keep != '1' }}
        run: |
          python3 -I scripts/state_paths.py pack raw-cache.tar.gz
          wrangler r2 object put dirtywaterwatch-data/state/raw-cache.tar.gz --file raw-cache.tar.gz --remote
      - name: Keep the summary and the step logs (14 days)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: state-batch-${{ github.run_id }}
          path: |
            data/build/batch/out/
            data/build/outfall-waters-*.json
          retention-days: 14
          if-no-files-found: ignore
      - name: Branch and pull request (the changed registry files, for a person to review)
        if: ${{ !cancelled() && steps.batch.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipeline/.venv/bin/python scripts/state_batch.py publish --state "$STATE" --body "$OUT/pr-body.md" \
            --date "$BATCH_DATE"
